<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>오늘의 날씨</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
	<style>
		:root {
			--ink: #353331;
			--muted: #77736b;
			--paper: #fcfbf7;
			--line: #ebe8df;
			--yellow: #f3d889;
			--yellow-soft: #fff6d9;
			--accent: #c79542;
			--icon: #c08c2d;
			--shadow: 0 20px 55px rgba(114, 91, 45, 0.1);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-width: 320px;
			color: var(--ink);
			background-color: #fffdf8;
			background-image:
				radial-gradient(circle at 4% 0%, rgba(255, 235, 166, .4) 0, rgba(255, 235, 166, 0) 28%),
				radial-gradient(circle at 96% 100%, rgba(250, 220, 128, .28) 0, rgba(250, 220, 128, 0) 30%),
				linear-gradient(135deg, #ffffff 0%, #fffdf8 58%, #fff5d5 100%);
			font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
			font-weight: 500;
		}

		button { font: inherit; }
		.page { width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding: 36px 0 56px; }
		.topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
		.brand { display: flex; align-items: center; gap: 12px; }
		.brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: #96702d; background: var(--yellow); font-size: 20px; }
		.brand-copy { display: flex; flex-direction: column; gap: 3px; }
		.brand-title { color: #3f392e; font-family: "Trebuchet MS", "Malgun Gothic", sans-serif; font-size: 21px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
		.brand-caption { color: #a0844d; font-family: Arial, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: .2em; line-height: 1; }
		.date { color: var(--muted); font-family: Arial, sans-serif; font-size: 12px; letter-spacing: .08em; }
		.back-link { margin-left: auto; color: var(--muted); font-family: Arial, sans-serif; font-size: 12px; text-decoration: none; white-space: nowrap; }
		.back-link:hover { color: var(--accent); }

		.intro { margin-bottom: 18px; }
		.eyebrow { margin: 0 0 10px; color: var(--accent); font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); font-weight: 800; line-height: 1.05; letter-spacing: -.04em; }
		.subtitle { margin: 12px 0 0; color: var(--muted); font-family: Arial, sans-serif; font-size: 14px; }

		.search-wrap { position: relative; margin-top: 28px; }
		.city-search { width: 100%; max-width: 360px; padding: 11px 16px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: rgba(255,255,255,.8); font-family: inherit; font-size: 13px; font-weight: 500; }
		.city-search:focus { outline: none; border-color: #e5c56e; background: #fff; }
		.search-results { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; width: 100%; max-width: 360px; max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; background: #fffefb; box-shadow: var(--shadow); }
		.search-result-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font-family: inherit; font-size: 13px; font-weight: 700; text-align: left; cursor: pointer; }
		.search-result-item:last-child { border-bottom: 0; }
		.search-result-item:hover { background: #fff7dc; color: #765822; }
		.search-result-region { color: var(--muted); font-size: 11px; font-weight: 500; }
		.search-empty { padding: 12px 16px; color: var(--muted); font-family: Arial, sans-serif; font-size: 12px; }
		.locations { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 10px; }
		.region-tab, .city-option { border: 1px solid var(--line); border-radius: 7px; padding: 10px 17px; color: var(--muted); background: rgba(255,255,255,.72); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; transition: .2s ease; }
		.region-tab:hover, .region-tab.active, .city-option:hover, .city-option.active { border-color: #e5c56e; color: #765822; background: #fff7dc; }
		.city-list { display: flex; flex-wrap: wrap; gap: 7px; min-height: 38px; margin-bottom: 28px; }
		.city-list:empty { display: none; }
		.city-option { padding: 7px 13px; border-color: #f0e5ca; background: rgba(255,255,255,.55); font-size: 12px; }

		.dashboard-grid { display: grid; grid-template-columns: minmax(280px, .78fr) minmax(420px, 1.22fr); gap: 18px; align-items: stretch; }
		.weather-panel { display: flex; flex-direction: column; min-height: 410px; overflow: hidden; border: 1px solid rgba(229, 197, 110, .45); border-radius: 8px; background: rgba(255,255,255,.72); box-shadow: var(--shadow); }
		.current { display: flex; flex: 1; align-items: center; justify-content: center; gap: 26px; padding: 34px 24px; background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(255,246,216,.86)); }
		.weather-icon { position: relative; display: grid; place-items: center; width: 132px; height: 132px; line-height: 1; }
		.weather-icon img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(192, 140, 45, .25)); }
		.weather-icon::after { content: ""; position: absolute; right: 2px; bottom: 12px; width: 62px; height: 12px; border-radius: 50%; background: rgba(192, 140, 45, .16); filter: blur(5px); }
		.temperature { margin: 0; color: #353331; font-size: clamp(58px, 7vw, 82px); font-weight: 800; line-height: .9; letter-spacing: -.08em; }
		.temperature sup { margin-left: 5px; color: var(--accent); font-size: .34em; vertical-align: top; letter-spacing: 0; }
		.condition { margin: 16px 0 0; color: #755a26; font-family: inherit; font-size: 15px; font-weight: 700; }
		.feels { margin: 7px 0 0; color: var(--muted); font-family: Arial, sans-serif; font-size: 12px; }
		.details { display: grid; grid-template-columns: 1fr 1fr; align-content: center; gap: 1px; padding: 14px 24px 20px; background: rgba(255,255,255,.48); }
		.detail { padding: 18px 8px; border-bottom: 1px solid var(--line); }
		.detail:nth-child(3), .detail:nth-child(4) { border-bottom: 0; }
		.detail-label { display: block; margin-bottom: 8px; color: var(--muted); font-family: Arial, sans-serif; font-size: 11px; }
		.detail-value { font-size: 18px; font-weight: 700; }
		.map-panel { position: relative; min-height: 410px; overflow: hidden; padding: 24px; border: 1px solid rgba(229, 197, 110, .45); border-radius: 8px; background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(255,247,218,.76)); box-shadow: var(--shadow); }
		.map-heading { position: relative; z-index: 2; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
		.map-heading strong { font-size: 19px; font-weight: 800; }
		.map-heading span { color: var(--muted); font-size: 11px; }
		#map { position: absolute; inset: 58px 0 0; z-index: 1; min-height: 350px; }
		.leaflet-container { color: var(--ink); font-family: inherit; }
		.map-panel .leaflet-control-zoom a { color: #755a26; }

		.forecast-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 44px 0 17px; }
		h2 { margin: 0; font-size: 24px; font-weight: 800; }
		.unit-note { color: var(--muted); font-family: Arial, sans-serif; font-size: 11px; }
		.forecast { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
		.day { min-width: 0; padding: 22px 10px 20px; border: 0; border-right: 1px solid var(--line); color: inherit; background: transparent; cursor: pointer; font: inherit; text-align: center; }
		.day:last-child { border-right: 0; }
		.day-name { color: var(--muted); font-family: Arial, sans-serif; font-size: 11px; }
		.day:hover, .day.selected { background: #fff8e5; box-shadow: inset 0 -3px 0 #e4bd61; }
		.day-icon { display: block; width: 47px; height: 47px; margin: 14px auto 10px; filter: drop-shadow(0 4px 4px rgba(192, 140, 45, .2)); }
		.day-temp { font-size: 18px; font-weight: 700; }
		.day-temp small { color: var(--muted); font-size: 13px; }
		.rain { display: block; margin-top: 9px; color: #a47b2c; font-family: Arial, sans-serif; font-size: 10px; }
		.hourly-panel { margin-top: 20px; padding: 24px 26px 26px; border: 1px solid #eee3c9; border-radius: 8px; background: rgba(255, 255, 255, .78); box-shadow: 0 12px 30px rgba(143, 110, 43, .07); }
		.hourly-panel[hidden] { display: none; }
		.hourly-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 18px; }
		.hourly-title strong { font-size: 17px; font-weight: 800; }
		.hourly-title span { color: var(--muted); font-size: 11px; }
		.hourly-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; overflow-x: auto; }
		.hour { padding: 13px 8px; border: 1px solid #f0e9d9; border-radius: 6px; background: #fffdf9; text-align: center; }
		.hour-time { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
		.hour-icon { display: block; width: 30px; height: 30px; margin: 10px auto 7px; }
		.hour-temp { display: block; font-size: 16px; font-weight: 800; }
		.hour-condition { display: block; min-height: 30px; margin-top: 6px; color: #6d5a35; font-size: 11px; font-weight: 700; line-height: 1.35; }
		.hour-rain { display: block; margin-top: 6px; color: #a47b2c; font-size: 10px; }
		.footer { margin-top: 28px; color: #aaa99e; font-family: Arial, sans-serif; font-size: 11px; }

		@media (max-width: 700px) {
			.page { width: min(100% - 28px, 560px); padding-top: 24px; }
			.topbar { margin-bottom: 28px; }
			.date { display: none; }
			.dashboard-grid { grid-template-columns: 1fr; }
			.weather-panel { display: flex; min-height: 0; }
			.current { min-height: 280px; gap: 22px; padding: 36px 24px; }
			.weather-icon { width: 92px; height: 92px; }
			.details { padding: 12px 24px 20px; }
			.map-panel { min-height: 360px; }
			#map { min-height: 300px; }
			.detail { padding: 15px 8px; }
			.forecast { overflow-x: auto; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); }
			.day { padding-left: 8px; padding-right: 8px; }
			.hourly-panel { padding: 20px 14px; }
			.hourly-list { grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); }
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="topbar">
			<div class="brand"><span class="brand-mark">☼</span><span class="brand-copy"><strong class="brand-title">weather note</strong><span class="brand-caption">LOCAL WEATHER JOURNAL</span></span></div>
			<a class="back-link" href="../index.html">← 메인으로</a>
			<time class="date" datetime="2026-09-04">FRIDAY, SEP 04, 2026</time>
		</header>

		<section class="intro">
			<p class="eyebrow">daily forecast</p>
			<h1>오늘의 날씨</h1>
			<p class="subtitle" id="updated-location">서울, 대한민국 · 오늘 오후 2:30 기준</p>
		</section>

		<div class="search-wrap">
			<input type="text" id="city-search" class="city-search" placeholder="지역/도시 검색 (예: 여수)" autocomplete="off">
			<div class="search-results" id="search-results" hidden></div>
		</div>

		<nav class="locations" id="region-tabs" aria-label="지역 선택">
			<button class="region-tab active" data-region="전체" type="button">전체</button>
			<button class="region-tab" data-region="경기도" type="button">경기도</button>
			<button class="region-tab" data-region="강원도" type="button">강원도</button>
			<button class="region-tab" data-region="충청북도" type="button">충청북도</button>
			<button class="region-tab" data-region="충청남도" type="button">충청남도</button>
			<button class="region-tab" data-region="경상북도" type="button">경상북도</button>
			<button class="region-tab" data-region="경상남도" type="button">경상남도</button>
			<button class="region-tab" data-region="전라북도" type="button">전라북도</button>
			<button class="region-tab" data-region="전라남도" type="button">전라남도</button>
			<button class="region-tab" data-region="제주도" type="button">제주도</button>
		</nav>
		<div class="city-list" id="city-list" aria-label="세부 지역 선택"></div>

		<div class="dashboard-grid">
			<section class="weather-panel" aria-label="현재 날씨">
				<div class="current">
					<div class="weather-icon" id="main-icon" aria-label="맑음"><img id="main-icon-img" src="" alt=""></div>
					<div>
						<p class="temperature" id="temperature">24<sup>°C</sup></p>
						<p class="condition" id="condition">맑고 따뜻해요</p>
						<p class="feels" id="feels">체감 온도 25°C</p>
					</div>
				</div>
				<div class="details">
					<div class="detail"><span class="detail-label">최고 / 최저</span><span class="detail-value" id="high-low">27° / 18°</span></div>
					<div class="detail"><span class="detail-label">강수 확률</span><span class="detail-value" id="rain-value">10%</span></div>
					<div class="detail"><span class="detail-label">습도</span><span class="detail-value" id="humidity">52%</span></div>
					<div class="detail"><span class="detail-label">바람</span><span class="detail-value" id="wind">서 2.4 m/s</span></div>
				</div>
			</section>

			<section class="map-panel" aria-label="지역 선택 지도">
				<div class="map-heading"><strong>지역 선택</strong><span>지도의 핀을 눌러보세요</span></div>
				<div id="map" aria-label="대한민국 지도"></div>
			</section>
		</div>

		<div class="forecast-heading"><h2>이번 주</h2><span class="unit-note">섭씨 · °C</span></div>
		<section class="forecast" id="forecast" aria-label="이번 주 날씨 예보"></section>
		<section class="hourly-panel" id="hourly-panel" aria-live="polite" hidden>
			<div class="hourly-title"><strong id="hourly-date">시간대별 날씨</strong><span>3시간 간격 예보</span></div>
			<div class="hourly-list" id="hourly-list"></div>
		</section>
		<p class="footer">맑은 하루를 기록해 보세요.</p>
	</main>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
	<script>
		// API 키는 이 파일에 두지 않습니다 - Cloudflare Worker 프록시(owm-proxy-worker.js 참고)가
		// 키를 서버 쪽에 숨겨서 대신 호출해줍니다. 아래 주소를 배포한 Worker 주소로 바꿔주세요.
		const WORKER_BASE = 'https://polished-smoke-83cf.y49959946.workers.dev';

		// 도시 한글명 -> OpenWeatherMap 검색용 "영문명,국가코드"
		const CITY_QUERY = {
			서울: 'Seoul,KR',
			부산: 'Busan,KR',
			제주: 'Jeju,KR',
			서귀포: 'Seogwipo,KR',
			인천: 'Incheon,KR',
			대전: 'Daejeon,KR',
			대구: 'Daegu,KR',
			광주: 'Gwangju,KR',
			울산: 'Ulsan,KR',
			세종: 'Sejong,KR',
			수원: 'Suwon,KR',
			성남: 'Seongnam,KR',
			고양: 'Goyang,KR',
			용인: 'Yongin,KR',
			부천: 'Bucheon,KR',
			안산: 'Ansan,KR',
			평택: 'Pyeongtaek,KR',
			의정부: 'Uijeongbu,KR',
			강릉: 'Gangneung,KR',
			원주: 'Wonju,KR',
			속초: 'Sokcho,KR',
			전주: 'Jeonju,KR',
			청주: 'Cheongju,KR',
			천안: 'Cheonan,KR',
			춘천: 'Chuncheon,KR',
			포항: 'Pohang,KR',
			창원: 'Changwon,KR',
			진주: 'Jinju,KR',
			경주: 'Gyeongju,KR',
			안동: 'Andong,KR',
			목포: 'Mokpo,KR',
			여수: 'Yeosu,KR',
			순천: 'Suncheon,KR',
			군산: 'Gunsan,KR',
		};
		const CITY_COUNTRY = Object.fromEntries(Object.keys(CITY_QUERY).map((city) => [city, '대한민국']));
		// 서울·인천·부산·대구·광주·대전·울산·세종은 행정구역상 어느 도에도 속하지
		// 않는 광역시/특별시지만, 지리적으로 가까운 도 탭에 함께 묶었습니다.
		const REGION_CITIES = {
			전체: Object.keys(CITY_QUERY),
			경기도: ['서울', '인천', '수원', '성남', '고양', '용인', '부천', '안산', '평택', '의정부'],
			강원도: ['강릉', '춘천', '원주', '속초'],
			충청북도: ['청주'],
			충청남도: ['대전', '천안', '세종'],
			경상북도: ['대구', '포항', '경주', '안동'],
			경상남도: ['부산', '울산', '창원', '진주'],
			전라북도: ['전주', '군산'],
			전라남도: ['광주', '목포', '여수', '순천'],
			제주도: ['제주', '서귀포'],
		};

		// OpenWeatherMap 공식 아이콘 이미지 주소 (icon 코드에 낮/밤(d/n)까지 포함되어 있음)
		// 밤 아이콘(끝이 n)은 안 쓰고 항상 낮 버전(d)으로 통일해서 보여줍니다.
		function iconUrl(owmIcon, size) {
			const dayIcon = owmIcon.replace(/n$/, 'd');
			return `https://openweathermap.org/img/wn/${dayIcon}@${size || '2x'}.png`;
		}

		// API가 주는 상세 영어/한글 설명 대신, 우리가 정한 5가지 표현으로 단순화합니다.
		function conditionLabel(owmIcon) {
			const code = owmIcon.slice(0, 2);
			if (code === '01') return '맑음';
			if (code === '02') return '약간 흐림';
			if (code === '03' || code === '04' || code === '50') return '흐림';
			if (code === '09' || code === '10' || code === '11') return '비';
			if (code === '13') return '눈';
			return '맑음';
		}

		function windDirection(deg) {
			const dirs = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
			return dirs[Math.round(deg / 45) % 8];
		}

		// entry.dt_txt는 UTC 기준이라 그대로 쓰면 한국(UTC+9) 등에서 시간이 밀려요
		// (정오가 한국 밤 9시로 표시되는 식). API가 도시별로 알려주는 timezone
		// 오프셋(초)을 더해서, 그 도시 기준 "현지 시각"으로 바꿔 씁니다.
		const pad2 = (n) => String(n).padStart(2, '0');
		function toLocalDate(entry, tzOffsetSec) {
			return new Date((entry.dt + tzOffsetSec) * 1000);
		}
		function localDateKey(d) {
			return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
		}
		function localTimeLabel(d) {
			return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
		}

		// OpenWeatherMap 무료 키에서 바로 쓸 수 있는 "5일/3시간 간격" 예보를
		// (현지 기준) 날짜별로 묶어서 최고/최저/대표 아이콘을 계산합니다 (실질적으로 5일치).
		function groupDailyForecast(list, tzOffsetSec) {
			const byDate = new Map();
			list.forEach((entry) => {
				const date = localDateKey(toLocalDate(entry, tzOffsetSec));
				if (!byDate.has(date)) byDate.set(date, []);
				byDate.get(date).push(entry);
			});
			const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
			const today = localDateKey(new Date(Date.now() + tzOffsetSec * 1000));
			const days = Array.from(byDate.entries()).map(([date, entries]) => {
				const temps = entries.map((e) => e.main.temp);
				const high = Math.round(Math.max(...temps));
				const low = Math.round(Math.min(...temps));
				const noonEntry = entries.find((e) => toLocalDate(e, tzOffsetSec).getUTCHours() === 12) || entries[Math.floor(entries.length / 2)];
				const icon = noonEntry.weather[0].icon;
				const rain = Math.round(Math.max(...entries.map((e) => (e.pop || 0) * 100)));
				const label = date === today ? '오늘' : dayNames[new Date(`${date}T00:00:00Z`).getUTCDay()];
				return { date, label, icon, high, low, rain };
			});
			return { days, hourly: byDate };
		}

		async function fetchWeather(city) {
			const q = encodeURIComponent(CITY_QUERY[city]);
			const [currentRes, forecastRes] = await Promise.all([
				fetch(`${WORKER_BASE}?endpoint=weather&q=${q}&lang=kr`),
				fetch(`${WORKER_BASE}?endpoint=forecast&q=${q}&lang=kr`),
			]);
			if (!currentRes.ok || !forecastRes.ok) throw new Error('날씨 정보를 불러오지 못했어요.');
			return { current: await currentRes.json(), forecast: await forecastRes.json() };
		}

		const $ = (id) => document.getElementById(id);
		function renderCityList(region) {
			$('city-list').innerHTML = REGION_CITIES[region].map((city) => `
				<button class="city-option" data-city="${city}" type="button">${city}</button>
			`).join('');
		}

		const mapMarkers = new Map();
		const mapLocations = {
			서울: [37.5665, 126.978],
			부산: [35.1796, 129.0756],
			제주: [33.4996, 126.5312],
			서귀포: [33.2541, 126.5601],
			인천: [37.4563, 126.7052],
			대전: [36.3504, 127.3845],
			대구: [35.8714, 128.6014],
			광주: [35.1595, 126.8526],
			울산: [35.5384, 129.3114],
			세종: [36.4801, 127.289],
			수원: [37.2636, 127.0286],
			성남: [37.4201, 127.1262],
			고양: [37.6584, 126.832],
			용인: [37.2411, 127.1776],
			부천: [37.5034, 126.766],
			안산: [37.3236, 126.8219],
			평택: [36.9921, 127.1129],
			의정부: [37.7381, 127.0338],
			강릉: [37.7519, 128.8761],
			원주: [37.3422, 127.9202],
			속초: [38.207, 128.5918],
			전주: [35.8242, 127.148],
			청주: [36.6424, 127.489],
			천안: [36.8151, 127.1139],
			춘천: [37.8813, 127.7298],
			포항: [36.019, 129.3435],
			창원: [35.228, 128.6811],
			진주: [35.18, 128.1076],
			경주: [35.8562, 129.2247],
			안동: [36.5684, 128.7294],
			목포: [34.8118, 126.3922],
			여수: [34.7604, 127.6622],
			순천: [34.9506, 127.4872],
			군산: [35.9676, 126.7369],
		};
		const weatherMap = window.L ? L.map('map', { zoomControl: false }).setView([36.2, 127.8], 6) : null;
		if (weatherMap) {
			L.control.zoom({ position: 'bottomright' }).addTo(weatherMap);
			L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 18,
				attribution: '&copy; OpenStreetMap contributors',
			}).addTo(weatherMap);
			Object.entries(mapLocations).forEach(([city, coordinates]) => {
				const marker = L.circleMarker(coordinates, {
					radius: 8,
					color: '#ffffff',
					weight: 3,
					fillColor: '#c08c2d',
					fillOpacity: .95,
				}).addTo(weatherMap).bindTooltip(city, { direction: 'top', offset: [0, -8] });
				marker.on('click', () => selectCity(city));
				mapMarkers.set(city, marker);
			});
		}

		function updateMapSelection(city) {
			mapMarkers.forEach((marker, markerCity) => marker.setStyle({
				radius: markerCity === city ? 11 : 8,
				fillColor: markerCity === city ? '#8f641b' : '#c08c2d',
			}));
		}

		function renderHourly(entries, label, tzOffsetSec) {
			$('hourly-date').textContent = `${label} 시간대별 날씨`;
			$('hourly-list').innerHTML = entries.map((entry) => `
				<div class="hour"><span class="hour-time">${localTimeLabel(toLocalDate(entry, tzOffsetSec))}</span><img class="hour-icon" src="${iconUrl(entry.weather[0].icon)}" alt=""><span class="hour-temp">${Math.round(entry.main.temp)}°C</span><span class="hour-condition">${conditionLabel(entry.weather[0].icon)}</span><span class="hour-rain">강수 확률 ${Math.round((entry.pop || 0) * 100)}%</span></div>
			`).join('');
			$('hourly-panel').hidden = false;
		}

		function renderForecast(forecastData, tzOffsetSec) {
			$('forecast').innerHTML = forecastData.days.map((day, index) => `
				<button class="day${index === 0 ? ' selected' : ''}" data-date="${day.date}" data-label="${day.label}" type="button"><span class="day-name">${day.label}</span><img class="day-icon" src="${iconUrl(day.icon)}" alt=""><span class="day-temp">${day.high}° <small>${day.low}°</small></span><span class="rain">강수 확률 ${day.rain}%</span></button>
			`).join('');
			document.querySelectorAll('.day').forEach((button) => button.addEventListener('click', () => {
				document.querySelectorAll('.day').forEach((day) => day.classList.remove('selected'));
				button.classList.add('selected');
				renderHourly(forecastData.hourly.get(button.dataset.date), button.dataset.label, tzOffsetSec);
			}));
			const firstDay = forecastData.days[0];
			if (firstDay) renderHourly(forecastData.hourly.get(firstDay.date), firstDay.label, tzOffsetSec);
		}

		async function selectCity(city) {
			document.querySelectorAll('.city-option').forEach((button) => button.classList.toggle('active', button.dataset.city === city));
			updateMapSelection(city);
			$('condition').textContent = '불러오는 중...';
			try {
				const { current, forecast } = await fetchWeather(city);
				const now = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
				$('updated-location').textContent = `${city}, ${CITY_COUNTRY[city]} · 오늘 ${now} 기준`;
				$('main-icon-img').src = iconUrl(current.weather[0].icon, '4x');
				$('main-icon').setAttribute('aria-label', conditionLabel(current.weather[0].icon));
				$('temperature').innerHTML = `${Math.round(current.main.temp)}<sup>°C</sup>`;
				$('condition').textContent = conditionLabel(current.weather[0].icon);
				$('feels').textContent = `체감 온도 ${Math.round(current.main.feels_like)}°C`;
				$('high-low').textContent = `${Math.round(current.main.temp_max)}° / ${Math.round(current.main.temp_min)}°`;
				$('rain-value').textContent = `${Math.round((forecast.list[0].pop || 0) * 100)}%`;
				$('humidity').textContent = `${current.main.humidity}%`;
				$('wind').textContent = `${windDirection(current.wind.deg)} ${current.wind.speed.toFixed(1)} m/s`;
				const tzOffsetSec = (forecast.city && forecast.city.timezone) || 0;
				renderForecast(groupDailyForecast(forecast.list, tzOffsetSec), tzOffsetSec);
			} catch (err) {
				$('condition').textContent = '날씨 정보를 불러오지 못했어요.';
				console.error(err);
			}
		}

		document.querySelectorAll('.region-tab').forEach((button) => button.addEventListener('click', () => {
			document.querySelectorAll('.region-tab').forEach((tab) => tab.classList.toggle('active', tab === button));
			renderCityList(button.dataset.region);
		}));
		$('city-list').addEventListener('click', (event) => {
			const cityButton = event.target.closest('.city-option');
			if (cityButton) selectCity(cityButton.dataset.city);
		});

		// 도시 검색: 어느 지역 탭에 속하는지 미리 계산해두고, 검색 결과를 고르면
		// 그 지역 탭으로 자동 전환하면서 도시를 선택합니다.
		const cityRegionOf = {};
		Object.entries(REGION_CITIES).forEach(([region, cities]) => {
			if (region === '전체') return;
			cities.forEach((city) => { cityRegionOf[city] = region; });
		});
		const cityNames = Object.keys(CITY_QUERY);

		function closeSearchResults() {
			$('search-results').hidden = true;
			$('search-results').innerHTML = '';
		}

		function renderSearchResults(query) {
			const trimmed = query.trim();
			if (!trimmed) {
				closeSearchResults();
				return;
			}
			const matches = cityNames.filter((city) => city.includes(trimmed));
			$('search-results').innerHTML = matches.length
				? matches.map((city) => `
					<button type="button" class="search-result-item" data-city="${city}">${city}<span class="search-result-region">${cityRegionOf[city] || ''}</span></button>
				`).join('')
				: `<div class="search-empty">"${trimmed}"과 일치하는 지역이 없어요.</div>`;
			$('search-results').hidden = false;
		}

		function selectFromSearch(city) {
			const region = cityRegionOf[city] || '전체';
			document.querySelectorAll('.region-tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.region === region));
			renderCityList(region);
			selectCity(city);
			$('city-search').value = '';
			closeSearchResults();
		}

		$('city-search').addEventListener('input', (e) => renderSearchResults(e.target.value));
		$('city-search').addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				const first = $('search-results').querySelector('.search-result-item');
				if (first) selectFromSearch(first.dataset.city);
			} else if (e.key === 'Escape') {
				closeSearchResults();
			}
		});
		$('search-results').addEventListener('click', (event) => {
			const item = event.target.closest('.search-result-item');
			if (item) selectFromSearch(item.dataset.city);
		});
		document.addEventListener('click', (event) => {
			if (!event.target.closest('.search-wrap')) closeSearchResults();
		});

		renderCityList('전체');
		selectCity('서울');
	</script>
</body>
</html>

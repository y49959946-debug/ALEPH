<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>이메일 인증 | 행로</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
		<style>
			:root {
				--ink: #292d29;
				--soft-ink: #747972;
				--paper: #fffdf7;
				--line: #e6dfd1;
				--coral: #db806c;
				--shadow: 0 24px 60px rgba(82, 66, 45, 0.12);
			}
			* { box-sizing: border-box; }
			[hidden] { display: none !important; }
			html { background: #ede8dc; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink); background: radial-gradient(circle at 15% 5%, #f7f2e8 0, transparent 31rem), #ede8dc; font-family: "Gowun Dodum", "Noto Sans KR", sans-serif; }
			a, button { font: inherit; }

			.auth-card { position: relative; overflow: hidden; width: min(400px, calc(100% - 36px)); margin: 24px; border: 1px solid #e0d8c8; border-radius: 4px 4px 12px 4px; background: var(--paper); box-shadow: var(--shadow); }
			.auth-card-inner { position: relative; padding: 40px 34px 36px; text-align: center; }
			.auth-logo { display: block; height: 64px; width: auto; margin: 0 auto 18px; }
			h1 { margin: 0 0 12px; font-family: "Nanum Pen Script", cursive; font-size: 30px; font-weight: 400; }
			.verify-text { margin: 0 0 26px; color: var(--soft-ink); font-size: 14px; line-height: 1.7; }
			.verify-action { display: block; border: 0; border-radius: 20px; padding: 11px; color: var(--paper); background: var(--coral); font-size: 15px; font-weight: 700; text-decoration: none; }
			.verify-action:hover { background: #c96e5a; }
			.auth-loading { display: grid; place-items: center; padding: 60px 0; color: var(--soft-ink); font-size: 14px; }
		</style>
	</head>
	<body>
		<main class="auth-card">
			<div class="auth-card-inner">
				<div id="verify-loading" class="auth-loading">확인 중...</div>
				<div id="verify-content" hidden>
					<img class="auth-logo" src="PlanDoSee_logo.png" alt="PlanDoSee" />
					<h1 id="verify-heading"></h1>
					<p class="verify-text" id="verify-text"></p>
					<a class="verify-action" id="verify-action" href="PlanDoSee_login.html">로그인 화면으로</a>
				</div>
			</div>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
		<script src="../supabase-client.js"></script>
		<script>
			// Supabase가 이메일 인증 링크를 처리하고 이 페이지로 돌려보낼 때
			// - implicit 흐름: URL 해시(#access_token=...)에 토큰을 실어 보냄 → supabase-js가 로드되며 자동으로 세션을 만듦
			// - PKCE 흐름: URL 쿼리(?code=...)로 코드를 보냄 → exchangeCodeForSession으로 직접 세션을 교환해야 함
			// - 링크가 만료/무효면 해시 또는 쿼리에 error/error_code가 담겨 옴
			const hashParams = new URLSearchParams(location.hash.startsWith("#") ? location.hash.slice(1) : location.hash);
			const searchParams = new URLSearchParams(location.search);

			const loadingEl = document.querySelector("#verify-loading");
			const contentEl = document.querySelector("#verify-content");
			const headingEl = document.querySelector("#verify-heading");
			const textEl = document.querySelector("#verify-text");
			const actionEl = document.querySelector("#verify-action");

			function showResult(heading, text, actionLabel, actionHref) {
				headingEl.textContent = heading;
				textEl.textContent = text;
				actionEl.textContent = actionLabel;
				actionEl.href = actionHref;
				loadingEl.hidden = true;
				contentEl.hidden = false;
			}

			function showSuccess() {
				showResult(
					"이메일 인증이 완료되었습니다",
					"가입한 이메일 확인이 끝났어요. 아래 버튼으로 다이어리를 시작해보세요.",
					"다이어리 시작하기",
					"PlanDoSee.html"
				);
			}

			function showFailure(errorCode, errorDescription) {
				const text = errorCode === "otp_expired"
					? "인증 링크가 만료됐어요. 로그인 화면에서 다시 가입을 시도해주세요."
					: (errorDescription ? decodeURIComponent(errorDescription.replace(/\+/g, " ")) : "인증 링크가 유효하지 않아요.");
				showResult("인증에 실패했어요", text, "로그인 화면으로", "PlanDoSee_login.html");
			}

			(async function init() {
				const errorCode = hashParams.get("error_code") || searchParams.get("error_code");
				const errorDescription = hashParams.get("error_description") || searchParams.get("error_description");
				if (errorCode || errorDescription) { showFailure(errorCode, errorDescription); return; }

				const code = searchParams.get("code");
				if (code) {
					const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
					if (error) { showFailure(error.code, error.message); return; }
					showSuccess();
					return;
				}

				// implicit 흐름: supabase-js가 위 스크립트 로드 시점에 이미 URL 해시를 읽어 세션을 만들어둠
				const { data: { session } } = await supabaseClient.auth.getSession();
				if (session) { showSuccess(); return; }

				showResult(
					"인증 확인 화면",
					"유효한 인증 링크로 들어오지 않았어요. 로그인 화면에서 다시 시도해주세요.",
					"로그인 화면으로",
					"PlanDoSee_login.html"
				);
			})();
		</script>
	</body>
</html>

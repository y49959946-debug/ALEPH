<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Level Up</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
	<style>
		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: transparent;
			font-family: "Galmuri11", "Courier New", monospace;
			overflow: hidden;
		}

		.sr-only {
			position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
			overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
		}

		.backdrop {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			background:
				radial-gradient(ellipse at 50% 48%, rgba(80, 40, 150, .35), rgba(6, 10, 22, 0) 60%),
				rgba(6, 10, 22, .80);
		}

		.panel { text-align: center; }

		.title {
			margin: 0 0 clamp(14px, 3vh, 30px);
			font-family: "Galmuri11", "Courier New", monospace;
			font-size: clamp(30px, 6vh, 52px);
			font-weight: 700;
			letter-spacing: .12em;
			color: #f6d784;
			text-shadow: 0 .08em 0 #7a4a12, .08em .16em 0 #2b1554;
		}

		.cards {
			display: flex;
			gap: clamp(14px, 2.4vw, 40px);
			justify-content: center;
			align-items: flex-end;
		}

		.card {
			--w: clamp(150px, min(16vw, 34vh), 270px);
			position: relative;
			width: var(--w);
			padding: 0;
			border: 0;
			background: none;
			cursor: pointer;
			font: inherit;
			transition: transform .12s steps(2);
		}
		.card img {
			display: block;
			width: 100%;
			height: auto;
			image-rendering: pixelated;
			filter: drop-shadow(0 10px 0 rgba(0, 0, 0, .35));
		}
		.card.epic { --w: clamp(170px, min(18.2vw, 38.6vh), 307px); }
		.card.rare { --w: clamp(160px, min(17vw, 36vh), 284px); }

		.card:hover, .card:focus-visible { transform: translateY(-10px); }
		.card:hover img, .card:focus-visible img { filter: drop-shadow(0 0 0 #c79bff) drop-shadow(0 10px 0 rgba(0, 0, 0, .35)) brightness(1.08); }
		.card.rare:hover img, .card.rare:focus-visible img { filter: drop-shadow(0 0 10px rgba(255, 200, 80, .7)) brightness(1.08); }
		.card.epic:hover img, .card.epic:focus-visible img { filter: drop-shadow(0 0 10px rgba(120, 200, 255, .7)) brightness(1.08); }
		.card:focus-visible { outline: 4px solid #ffe9a8; outline-offset: 6px; }
		.card:disabled { cursor: default; }

		.key {
			position: absolute;
			left: 50%; bottom: -34px;
			transform: translateX(-50%);
			min-width: 26px;
			padding: 3px 7px;
			font-size: 14px;
			color: #f6e6bf;
			background: #1c1236;
			box-shadow: 0 0 0 2px #d9a54a;
		}
		.badge {
			position: absolute;
			left: 50%; top: 8%;
			transform: translateX(-50%);
			padding: 3px 8px;
			font-size: clamp(11px, 1.6vh, 14px);
			color: #f6e6bf;
			background: rgba(28, 18, 54, .92);
			box-shadow: 0 0 0 2px #8f5cf0;
			white-space: nowrap;
		}

		.hint small { font-size: .82em; color: #a995cf; }
		.hint {
			margin: 52px 0 0;
			line-height: 1.7;
			font-size: clamp(13px, 2vh, 17px);
			letter-spacing: .06em;
			color: #cbbbe6;
		}

		@media (prefers-reduced-motion: reduce) {
			.card { transition: none; }
			.card:hover, .card:focus-visible { transform: none; }
		}
	</style>
</head>
<body>
	<div class="backdrop">
		<div class="panel" role="dialog" aria-modal="true" aria-labelledby="lvTitle">
			<h1 class="title" id="lvTitle">LEVEL UP!</h1>
			<div class="cards" id="cards"></div>
			<p class="hint">→ 카드를 선택하세요 ←<br><small>클릭 · 숫자 1/2/3 · ←→ 후 Enter</small></p>
		</div>
	</div>

	<script>
		// weight 1 = normal odds. extra_shot is strong enough to pull down on
		// purpose so it doesn't show up as often as the other four.
		// extra_shot's desc shows live progress (Screen.html passes how many
		// times it's already been picked via ?extraShotCount=N, max 6).
		const EXTRA_SHOT_MAX_PICKS = 6;
		const extraShotCount = Number(new URLSearchParams(location.search).get('extraShotCount') || 0);
		const UPGRADES = [
			{ key: 'atk_speed', title: '마법 발사 속도 증가', desc: '마법 발사 속도가\n15% 빨라집니다.', weight: 1 },
			{
				key: 'extra_shot',
				title: '마법 발사 개수 추가',
				desc: `마법이 1개 더 발사됩니다.\n(${extraShotCount}/${EXTRA_SHOT_MAX_PICKS}회 획득, ${EXTRA_SHOT_MAX_PICKS - extraShotCount}회 남음)`,
				weight: 0.5,
			},
			{ key: 'move_speed', title: '이동 속도 증가', desc: '이동 속도가\n10% 빨라집니다.', weight: 1 },
			{ key: 'full_heal', title: 'HP 전부 회복', desc: '체력을 모두\n회복합니다.', weight: 1 },
			{ key: 'damage_up', title: '데미지 증가', desc: '마법 데미지가\n5% 증가합니다.', weight: 1 },
		];

		// "마법 관통 추가"(rare/gold)는 10레벨 배수일 때만 후보 풀에 들어갑니다.
		// "마법 파동"과 "마법 난사"(둘 다 epic/diamond, 한 등급 더 위)는 이제 다른
		// 카드들과 똑같이 5레벨마다 후보로 들어갑니다 (Screen.html이 ?pierce=1&
		// wave=1&spray=1로 알려줌). 파동/난사는 한 번 뽑으면 그걸로 끝인 일회성
		// 해금(5% 확률 고정)이라, 뽑고 나면 waveMaxed=1 / sprayMaxed=1로 후보에서
		// 빠져서 다시는 안 나옵니다.
		const PIERCE_UPGRADE = { key: 'pierce', title: '마법 관통 추가', desc: '마법이 적을\n1명 더 관통합니다.', weight: 0.4 }; // 1 / 2.5
		const WAVE_UPGRADE = { key: 'wave', title: '마법 파동', desc: '1초마다 5% 확률로\n마법이 사방으로\n무더기 발사됩니다.', weight: 0.2 };
		const SPRAY_UPGRADE = { key: 'spray', title: '마법 난사', desc: '1초마다 5% 확률로\n공격 방향 10~15발이\n45도 각도로 퍼져나갑니다.', weight: 0.2 };

		function buildPool() {
			const params = new URLSearchParams(location.search);
			let pool = [...UPGRADES];
			if (params.get('extraShotMaxed') === '1') {
				pool = pool.filter((u) => u.key !== 'extra_shot');
			}
			if (params.get('pierce') === '1') pool.push(PIERCE_UPGRADE);
			if (params.get('wave') === '1' && params.get('waveMaxed') !== '1') pool.push(WAVE_UPGRADE);
			if (params.get('spray') === '1' && params.get('sprayMaxed') !== '1') pool.push(SPRAY_UPGRADE);
			return pool;
		}

		function pickThree() {
			const pool = buildPool();
			const picked = [];
			while (picked.length < 3 && pool.length > 0) {
				const totalWeight = pool.reduce((sum, u) => sum + u.weight, 0);
				let roll = Math.random() * totalWeight;
				let i = 0;
				while (i < pool.length - 1 && roll > pool[i].weight) {
					roll -= pool[i].weight;
					i += 1;
				}
				picked.push(pool.splice(i, 1)[0]);
			}
			return picked;
		}

		const cardsEl = document.getElementById('cards');
		let picked = false; // 한 번 고르면 끝 — 빠른 연타로 강화가 여러 번 적용되지 않게

		function choose(upgrade) {
			if (picked) return;
			picked = true;
			cardsEl.querySelectorAll('button').forEach((b) => { b.disabled = true; });
			window.parent.postMessage({ source: 'level-card', key: upgrade.key }, '*');
		}

		const pickedCards = pickThree();
		pickedCards.forEach((upgrade, index) => {
			const card = document.createElement('button');
			card.type = 'button';
			card.className = 'card' + (upgrade.key === 'pierce' ? ' rare' : (upgrade.key === 'wave' || upgrade.key === 'spray') ? ' epic' : '');
			card.innerHTML = `
				<img src="assets/cards/card_${upgrade.key}.png" alt="" draggable="false">
				<span class="sr-only">${index + 1}번. ${upgrade.title}. ${upgrade.desc.replace(/\n/g, ' ')}</span>
				${upgrade.key === 'extra_shot' ? `<span class="badge" aria-hidden="true">${extraShotCount}/${EXTRA_SHOT_MAX_PICKS}회 획득</span>` : ''}
				<span class="key" aria-hidden="true">${index + 1}</span>
			`;
			card.addEventListener('click', () => choose(upgrade));
			cardsEl.appendChild(card);
		});

		// 키보드: 숫자 1·2·3으로 바로 선택, 또는 Tab/←→로 이동 후 Enter
		window.addEventListener('keydown', (event) => {
			const buttons = [...cardsEl.querySelectorAll('button')];
			const n = Number(event.key);
			if (n >= 1 && n <= buttons.length) { buttons[n - 1].click(); return; }
			const i = buttons.indexOf(document.activeElement);
			if (event.key === 'ArrowRight') { buttons[(i + 1) % buttons.length].focus(); event.preventDefault(); }
			if (event.key === 'ArrowLeft') { buttons[(i - 1 + buttons.length) % buttons.length].focus(); event.preventDefault(); }
		});
		window.addEventListener('load', () => { const first = cardsEl.querySelector('button'); if (first) first.focus(); });
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>플레이 기록 - LUMORIA</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
	<style>
		* { box-sizing: border-box; }
		html { min-height: 100%; background: #070b14 url("assets/bg_forest.png") center / cover no-repeat fixed; }
		body { margin: 0; min-height: 100vh; padding: 1px 0; background: rgba(5, 8, 18, .78); color: #f6e6bf; font-family: "Galmuri11", "Courier New", monospace; }
		main { width: min(1100px, calc(100% - 32px)); margin: 40px auto; padding: 28px; background: #0f1729; box-shadow: 0 0 0 3px #06080f, 0 0 0 7px #d9a54a, 0 0 0 10px #06080f; }
		h1 { margin: 0 0 8px; color: #f6d784; letter-spacing: .08em; text-shadow: 0 3px 0 #7a4a12; }
		p { color: #cbbbe6; line-height: 1.7; margin: 0 0 16px; }
		.actions { display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 0; }
		button, a.btn { font: inherit; padding: 10px 18px; background: #0f1729; color: #f6e6bf; border: 0; box-shadow: 0 0 0 3px #d9a54a, 0 0 0 6px #06080f; cursor: pointer; text-decoration: none; }
		button.primary { background: #5a2cab; }
		button:focus-visible, a.btn:focus-visible { outline: 3px solid #ffe9a8; outline-offset: 8px; }
		.scroll { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; font-size: 14px; }
		th, td { padding: 8px 10px; border-bottom: 1px solid #22304f; text-align: left; white-space: nowrap; }
		th { color: #f6d784; position: sticky; top: 0; background: #0f1729; }
		td.clear { color: #9ff0c0; } td.fail { color: #ffb4bd; }
		.summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 18px; }
		.chip { padding: 8px 12px; background: #18233c; box-shadow: inset 4px 0 0 #8f5cf0; }
		#msg { min-height: 1.4em; color: #9ff0c0; }
	</style>
</head>
<body>
	<main>
		<h1>플레이 기록</h1>
		<p>판이 끝날 때마다 자동으로 저장됩니다(최근 100판, 이 브라우저에만 보관). 난이도 값은 그 판에 적용된 설정입니다.</p>
		<div class="summary" id="summary"></div>
		<div class="actions">
			<button class="primary" id="copyBtn" type="button">표 복사 (CSV)</button>
			<a class="btn" href="name_entry.html">게임으로</a>
			<button id="clearBtn" type="button">기록 지우기</button>
		</div>
		<p id="msg" role="status"></p>
		<div class="scroll">
			<table>
				<thead><tr><th>#</th><th>시각</th><th>모드</th><th>결과</th><th>시간(초)</th><th>레벨</th><th>처치</th><th>남은 HP</th><th>실패 원인</th><th>난이도(속도/피해/스폰/보스)</th></tr></thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</main>
	<script>
		const KEY = 'lumoriaRunLog';
		function load() {
			try {
				const raw = JSON.parse(window.localStorage.getItem(KEY));
				return Array.isArray(raw) ? raw.filter((r) => r && (r.result === 'clear' || r.result === 'fail') && Number.isFinite(r.ms)) : [];
			} catch (e) { return []; }
		}
		const diffText = (d) => d && typeof d === 'object' ? `${d.slimeSpeed}/${d.slimeDamage}/${d.spawnBase}+${d.spawnStep}/${d.bossStat}` : '-';
		function median(arr) { if (!arr.length) return 0; const a = [...arr].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
		function render() {
			const list = load();
			const tbody = document.getElementById('rows');
			tbody.textContent = '';
			list.forEach((r, i) => {
				const tr = document.createElement('tr');
				const cells = [i + 1, new Date(r.at).toLocaleString('ko-KR'), r.mode === '5m' ? '5분' : '30초', r.result === 'clear' ? '성공' : '실패', (r.ms / 1000).toFixed(1), r.level, r.kills, r.hp, r.cause, diffText(r.difficulty)];
				cells.forEach((c, ci) => { const td = document.createElement('td'); td.textContent = String(c ?? '-'); if (ci === 3) td.className = r.result; tr.appendChild(td); });
				tbody.appendChild(tr);
			});
			const sec = list.map((r) => r.ms / 1000);
			const clears = list.filter((r) => r.result === 'clear').length;
			const sum = document.getElementById('summary');
			sum.textContent = '';
			[[`전체 ${list.length}판`], [`성공 ${clears} · 실패 ${list.length - clears}`], [`시간 범위 ${sec.length ? Math.min(...sec).toFixed(1) : 0}~${sec.length ? Math.max(...sec).toFixed(1) : 0}초`], [`시간 중앙값 ${median(sec).toFixed(1)}초`]]
				.forEach(([t]) => { const d = document.createElement('div'); d.className = 'chip'; d.textContent = t; sum.appendChild(d); });
			return list;
		}
		const list0 = render();
		document.getElementById('copyBtn').addEventListener('click', async () => {
			const list = load();
			const lines = [['#', '시각', '모드', '결과', '시간(초)', '레벨', '처치', '남은HP', '원인', '속도', '피해', '스폰시작', '스폰증가', '보스배율'].join(',')]
				.concat(list.map((r, i) => [i + 1, r.at, r.mode === '5m' ? '5분' : '30초', r.result === 'clear' ? '성공' : '실패', (r.ms / 1000).toFixed(1), r.level, r.kills, r.hp, `"${String(r.cause).replace(/"/g, '""')}"`,
					r.difficulty?.slimeSpeed, r.difficulty?.slimeDamage, r.difficulty?.spawnBase, r.difficulty?.spawnStep, r.difficulty?.bossStat].join(',')));
			try { await navigator.clipboard.writeText(lines.join('\n')); document.getElementById('msg').textContent = `${list.length}판 기록을 복사했어요. 엑셀이나 문서에 붙여 넣으세요.`; }
			catch (e) { document.getElementById('msg').textContent = '복사가 막혀 있어요. 표를 직접 드래그해서 복사해 주세요.'; }
		});
		document.getElementById('clearBtn').addEventListener('click', () => {
			if (!window.confirm('플레이 기록을 모두 지울까요?')) return;
			try { window.localStorage.removeItem(KEY); } catch (e) {}
			render();
			document.getElementById('msg').textContent = '기록을 지웠어요.';
		});
	</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CLEAR - LUMORIA</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
	<style>
		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #142b2a;
			color: #fff;
			font-family: "Courier New", monospace;
			font-weight: bold;
		}

		body {
			display: grid;
			place-items: center;
		}

		.stage {
			position: relative;
			width: min(100vw, 177.7778vh);
			height: min(56.25vw, 100vh);
			background: radial-gradient(ellipse at 50% 40%, rgba(80, 150, 110, 0.35), #0a1615 70%);
			box-shadow: 0 0 0 8px #0a1719, 0 18px 50px rgba(0, 0, 0, .42);
			display: grid;
			place-items: center;
			image-rendering: pixelated;
		}

		.panel {
			width: min(620px, 86%);
			padding: 12px;
			background: #17252b;
			box-shadow:
				0 0 0 6px #0b1210,
				0 18px 40px rgba(0, 0, 0, .5);
		}

		.panel-inner {
			background: #87906c;
			padding: 40px 36px;
			text-align: center;
			box-shadow: inset 0 0 0 6px #263734;
		}

		.title {
			margin: 0;
			font-size: clamp(36px, 6vw, 56px);
			font-weight: bold;
			letter-spacing: 4px;
			color: #ffd76a;
			text-shadow: 4px 4px 0 #4a3a04;
		}

		.subtitle {
			margin: 18px 0 0;
			font-size: 15px;
			letter-spacing: 2px;
			color: #263734;
			font-weight: bold;
		}

		.survival-box {
			margin: 26px auto 0;
			width: fit-content;
			background: #263734;
			padding: 14px 28px;
			box-shadow: 0 0 0 4px #17252b;
		}

		.survival-label {
			display: block;
			font-size: 12px;
			letter-spacing: 2px;
			color: #9ab3a8;
			font-weight: bold;
		}

		.survival-time {
			display: block;
			margin-top: 6px;
			font-size: 34px;
			font-weight: bold;
			color: #f4e8b5;
			letter-spacing: 2px;
		}

		.retry-button {
			display: block;
			margin: 34px auto 0;
			padding: 16px 0;
			width: 260px;
			background: #e8d995;
			border: none;
			box-shadow: 0 0 0 6px #17252b;
			color: #202d2d;
			font-family: inherit;
			font-size: 22px;
			font-weight: bold;
			letter-spacing: 3px;
			cursor: pointer;
			transition: transform 0.12s ease, background 0.12s ease;
		}

		.retry-button:hover {
			background: #f4e8b5;
			transform: translateY(-3px);
		}

		.retry-button:active {
			transform: translateY(0);
			background: #c9bd87;
		}

		.exit-button {
			display: block;
			margin: 14px auto 0;
			padding: 14px 0;
			width: 260px;
			background: #263734;
			border: none;
			box-shadow: 0 0 0 6px #17252b;
			color: #cdd8d0;
			font-family: inherit;
			font-size: 18px;
			font-weight: bold;
			letter-spacing: 3px;
			cursor: pointer;
			transition: transform 0.12s ease, background 0.12s ease;
		}

		.exit-button:hover {
			background: #34433a;
			transform: translateY(-2px);
		}

		.exit-button:active {
			transform: translateY(0);
			background: #1c2926;
		}

		.ranking-button {
			display: block;
			margin: 14px auto 0;
			padding: 14px 0;
			width: 260px;
			background: #3a5a6b;
			border: none;
			box-shadow: 0 0 0 6px #17252b;
			color: #eaf4f8;
			font-family: inherit;
			font-size: 18px;
			font-weight: bold;
			letter-spacing: 3px;
			cursor: pointer;
			transition: transform 0.12s ease, background 0.12s ease;
		}

		.ranking-button:hover {
			background: #4c7085;
			transform: translateY(-2px);
		}

		.ranking-button:active {
			transform: translateY(0);
			background: #2c4552;
		}

		.hint {
			margin-top: 16px;
			font-size: 13px;
			letter-spacing: 1px;
			color: #34433a;
		}

		.ranking-overlay {
			position: fixed;
			inset: 0;
			background: rgba(10, 22, 20, 0.72);
			display: none;
			place-items: center;
			z-index: 500;
		}

		.ranking-overlay.visible {
			display: grid;
		}

		.ranking-panel {
			width: min(560px, 86%);
			padding: 12px;
			background: #17252b;
			box-shadow:
				0 0 0 6px #0b1210,
				0 18px 40px rgba(0, 0, 0, .5);
		}

		.ranking-panel-inner {
			background: #87906c;
			padding: 34px 30px;
			text-align: center;
			box-shadow: inset 0 0 0 6px #263734;
		}

		.ranking-title {
			margin: 0 0 22px;
			font-size: clamp(26px, 4vw, 36px);
			letter-spacing: 3px;
			color: #f4e8b5;
			text-shadow: 3px 3px 0 #263734;
		}

		.ranking-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: #66785e;
			padding: 12px 18px;
			margin-top: 10px;
			font-size: 16px;
			color: #f4e8b5;
		}

		.ranking-row:first-child {
			margin-top: 0;
		}

		.ranking-close-button {
			display: block;
			margin: 24px auto 0;
			padding: 12px 0;
			width: 200px;
			background: #e8d995;
			border: none;
			box-shadow: 0 0 0 6px #17252b;
			color: #202d2d;
			font-family: inherit;
			font-size: 16px;
			font-weight: bold;
			letter-spacing: 3px;
			cursor: pointer;
			transition: transform 0.12s ease, background 0.12s ease;
		}

		.ranking-close-button:hover {
			background: #f4e8b5;
			transform: translateY(-2px);
		}

		.ranking-close-button:active {
			transform: translateY(0);
			background: #c9bd87;
		}
	
		/* ===== LUMORIA 리디자인: 밤의 숲 배경 + 남색 패널 + 금 테두리 + 보라 버튼 ===== */
		html, body {
			background: #070b14 url("assets/bg_forest.png") center / cover no-repeat;
			font-family: "Galmuri11", "Courier New", monospace;
			image-rendering: pixelated;
		}
		body::before { content: ""; position: fixed; inset: 0; background: rgba(5, 8, 18, .62); }
		.stage { position: relative; background: transparent !important; box-shadow: none !important; }
		.panel {
			background: #0d1424 !important;
			padding: 10px !important;
			box-shadow: 0 0 0 3px #06080f, 0 0 0 7px #d9a54a, 0 0 0 10px #06080f, 0 18px 40px rgba(0, 0, 0, .55) !important;
		}
		.panel-inner { background: #0f1729 !important; box-shadow: inset 0 3px 0 #22304f !important; }
		.title { color: #f6d784 !important; text-shadow: 0 4px 0 #7a4a12, 4px 7px 0 #2b1554 !important; letter-spacing: .1em; }
		.subtitle { color: #f6e6bf !important; }
		.survival-box {
			background: #140b28 !important;
			box-shadow: 0 0 0 3px #d9a54a, 0 0 0 6px #06080f !important;
		}
		.survival-label { color: #cbbbe6 !important; }
		.survival-time { color: #f6e6bf !important; text-shadow: 2px 2px 0 #06080f; }
		.retry-button, .exit-button, .ranking-button, .ranking-close-button {
			font-family: inherit !important;
			background: #0f1729 !important;
			color: #f6e6bf !important;
			box-shadow: 0 0 0 3px #d9a54a, 0 0 0 6px #06080f !important;
			transform: none;
		}
		.retry-button { background: #5a2cab !important; box-shadow: 0 0 0 3px #d9a54a, 0 0 0 6px #06080f, inset 0 4px 0 #8f5cf0 !important; }
		.retry-button:hover, .exit-button:hover, .ranking-button:hover, .ranking-close-button:hover {
			background: #3a1d6e !important;
			transform: translateY(-3px);
		}
		.retry-button:focus-visible, .exit-button:focus-visible, .ranking-button:focus-visible, .ranking-close-button:focus-visible {
			outline: 3px solid #ffe9a8; outline-offset: 8px;
		}
		.hint { color: #a995cf !important; }
		.ranking-overlay { background: rgba(5, 8, 18, .72) !important; }
		.ranking-panel { background: #0d1424 !important; box-shadow: 0 0 0 3px #06080f, 0 0 0 7px #d9a54a, 0 0 0 10px #06080f !important; }
		.ranking-panel-inner { background: #0f1729 !important; box-shadow: none !important; }
		.ranking-title { color: #f6d784 !important; text-shadow: 0 4px 0 #7a4a12 !important; }
		.ranking-row { background: #18233c !important; color: #f6e6bf !important; box-shadow: inset 6px 0 0 #8f5cf0 !important; }
		.ranking-row:first-child { box-shadow: inset 6px 0 0 #f6d784 !important; }
	</style>
</head>
<body>
	<div class="stage">
		<div class="panel">
			<div class="panel-inner">
				<h1 class="title">CLEAR!</h1>
				<p class="subtitle" id="playerNameLine">맵 안의 모든 몬스터를 처치했습니다</p>

				<div class="survival-box">
					<span class="survival-label" id="modeLabel">CLEAR TIME</span>
					<span class="survival-time" id="clearTime">00:00</span>
				</div>

				<button class="retry-button" id="retryButton" type="button">다시하기</button>
				<button class="ranking-button" id="rankingButton" type="button">랭킹</button>
				<button class="exit-button" id="exitButton" type="button">나가기</button>
				<p class="hint">다시하기를 누르면 처음부터 새로 시작합니다 · <a href="records.html" style="color:#d6b4ff">플레이 기록 보기</a></p>
			</div>
		</div>
	</div>

	<div class="ranking-overlay" id="rankingOverlay">
		<div class="ranking-panel">
			<div class="ranking-panel-inner">
				<h2 class="ranking-title">RANKING</h2>
				<div id="rankingRows"></div>
				<button class="ranking-close-button" id="rankingCloseButton" type="button">닫기</button>
			</div>
		</div>
	</div>

	<script>
		// 저장소가 막혀 있거나 값이 깨져 있어도 화면이 멈추지 않도록 안전하게 읽기
		function readLocal(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
		function readSession(key) { try { return window.sessionStorage.getItem(key); } catch (e) { return null; } }
		function removeSession(key) { try { window.sessionStorage.removeItem(key); } catch (e) {} }

		// 방금 끝난 판의 모드 (30초 / 5분) — 다시하기·랭킹이 같은 모드로 이어지게
		const lastMode = readSession('lastMode') === '5m' ? '5m' : '30s';
		const modeLabel = lastMode === '5m' ? '5분 모드' : '30초 모드';

		function formatClock(ms) {
			const totalMs = Math.max(0, Math.floor(ms));
			const m = Math.floor(totalMs / 60000);
			const s = Math.floor(totalMs / 1000) % 60;
			const msPart = totalMs % 1000;
			return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(msPart).padStart(3, '0')}`;
		}

		const rawMs = Number(readSession('lastSurvivalMs'));
		const lastSurvivalMs = Number.isFinite(rawMs) && rawMs >= 0 ? rawMs : 0;
		document.getElementById('clearTime').textContent = formatClock(lastSurvivalMs);

		const rawName = readLocal('playerName');
		const playerName = typeof rawName === 'string' ? rawName.trim().slice(0, 10) : '';
		if (playerName) {
			document.getElementById('playerNameLine').textContent = `${playerName}님, 맵 안의 모든 몬스터를 처치했습니다`;
		}

		document.getElementById('modeLabel').textContent += ` · ${modeLabel}`;

		document.getElementById('retryButton').addEventListener('click', () => {
			removeSession('lastSurvivalMs');
			window.location.href = `Screen.html?mode=${lastMode}`;
		});

		document.getElementById('exitButton').addEventListener('click', () => {
			removeSession('lastSurvivalMs');
			window.location.href = '../index.html';
		});

		// Same storage key/shape Screen.html writes to when a run clears:
		// [{ name, ms }], ascending by ms (fastest first), top 3 only.
		const RANKING_KEY = lastMode === '5m' ? 'lumoriaRanking5m' : 'lumoriaRanking30s';
		const RANKING_SIZE = 3;

		// 손상된 항목(이름이 문자열이 아니거나 시간이 숫자가 아님)은 버리고 정상 항목만 표시
		function getRanking() {
			let raw;
			try { raw = JSON.parse(readLocal(RANKING_KEY)); } catch (e) { raw = null; }
			if (!Array.isArray(raw)) return [];
			return raw
				.filter((e) => e && typeof e.name === 'string' && Number.isFinite(e.ms) && e.ms >= 0)
				.sort((a, b) => a.ms - b.ms)
				.slice(0, RANKING_SIZE);
		}

		function renderRanking() {
			const ranking = getRanking();
			const rowsEl = document.getElementById('rankingRows');
			rowsEl.innerHTML = '';
			for (let i = 0; i < RANKING_SIZE; i += 1) {
				const entry = ranking[i];
				const row = document.createElement('div');
				row.className = 'ranking-row';
				// 이름은 글자로만 넣음(태그가 실행되지 않게)
				const left = document.createElement('span');
				left.textContent = `${String(i + 1).padStart(2, '0')}  ${entry ? entry.name.slice(0, 10) : '---'}`;
				const right = document.createElement('span');
				right.textContent = entry ? formatClock(entry.ms) : '--:--.---';
				row.append(left, right);
				rowsEl.appendChild(row);
			}
		}

		const rankingOverlay = document.getElementById('rankingOverlay');

		document.getElementById('rankingButton').addEventListener('click', () => {
			renderRanking();
			document.querySelector('.ranking-title').textContent = `RANKING · ${lastMode === '5m' ? '5분' : '30초'}`;
			rankingOverlay.classList.add('visible');
		});

		document.getElementById('rankingCloseButton').addEventListener('click', () => {
			rankingOverlay.classList.remove('visible');
		});
	</script>
</body>
</html>

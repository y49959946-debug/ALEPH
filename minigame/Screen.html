<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pixel Meadow</title>
	<style>
		:root {
			background: #142b2a;
			color: #fff;
			font-family: "Courier New", monospace;
		}

		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #142b2a;
		}

		body {
			display: grid;
			place-items: center;
		}

		#game {
			display: block;
			width: min(100vw, 177.7778vh);
			height: min(56.25vw, 100vh);
			cursor: crosshair;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			background: #82c9db;
			box-shadow: 0 0 0 8px #0a1719, 0 18px 50px rgba(0, 0, 0, .42);
		}
	</style>
</head>
<body>
	<canvas id="game" width="1920" height="1080" aria-label="픽셀풍 초원 게임 화면"></canvas>

	<script>
		const canvas = document.querySelector('#game');
		let ctx = canvas.getContext('2d');
		ctx.imageSmoothingEnabled = false;

		const W = canvas.width;
		const H = canvas.height;

		function rect(x, y, width, height, color) {
			ctx.fillStyle = color;
			ctx.fillRect(x, y, width, height);
		}

		function pixelTree(x, y, scale = 1) {
			const s = scale;
			// Shadow and trunk.
			rect(x - 52 * s, y + 130 * s, 220 * s, 34 * s, '#407245');
			rect(x + 40 * s, y + 14 * s, 58 * s, 152 * s, '#70452d');
			rect(x + 54 * s, y + 18 * s, 22 * s, 148 * s, '#9a6138');
			rect(x + 80 * s, y + 86 * s, 18 * s, 80 * s, '#4e352b');

			// Blocky canopy outline, highlights, and shadow.
			rect(x - 26 * s, y - 70 * s, 194 * s, 56 * s, '#1f5943');
			rect(x - 70 * s, y - 20 * s, 282 * s, 92 * s, '#1f5943');
			rect(x - 30 * s, y - 74 * s, 92 * s, 38 * s, '#337e4a');
			rect(x + 52 * s, y - 112 * s, 76 * s, 50 * s, '#337e4a');
			rect(x + 116 * s, y - 55 * s, 82 * s, 52 * s, '#2a7045');
			rect(x - 42 * s, y + 8 * s, 92 * s, 58 * s, '#2a7045');
			rect(x + 46 * s, y - 26 * s, 126 * s, 112 * s, '#2a7045');
			rect(x + 76 * s, y - 66 * s, 54 * s, 34 * s, '#57a955');
			rect(x - 8 * s, y - 24 * s, 50 * s, 34 * s, '#57a955');
			rect(x + 128 * s, y + 10 * s, 42 * s, 34 * s, '#1c513b');
			rect(x + 12 * s, y + 45 * s, 58 * s, 35 * s, '#1c513b');
		}

		function drawMeadow() {
			// A single flat base color across the whole field, no top/bottom split.
			rect(0, 0, W, H, '#69a94c');

			// Tiny grass clusters keep the pixel texture detailed but unobtrusive.
			// Covers the full canvas height so the top band isn't left flat.
			for (let i = 0; i < 260; i += 1) {
				const x = (i * 137) % W;
				const y = (i * 83) % (H - 20);
				const color = i % 4 === 0 ? '#8bc65c' : i % 3 === 0 ? '#4e9148' : '#5d9c48';
				rect(x, y, 4, 12, color);
				rect(x - 4, y + 6, 4, 5, color);
				if (i % 5 === 0) rect(x + 5, y + 3, 3, 8, color);
			}

		}

		function drawFlowers() {
			const flowers = [
				[280, 650, '#f6d76b'], [410, 520, '#f3f0cf'], [1530, 650, '#f5c8d3'],
				[1660, 480, '#f6d76b'], [730, 850, '#f3f0cf'], [1410, 900, '#f5c8d3'],
				[535, 760, '#f5c8d3'], [1760, 790, '#f3f0cf']
			];
			flowers.forEach(([x, y, color]) => {
				rect(x, y + 10, 7, 25, '#3e8142');
				rect(x - 13, y, 14, 14, color);
				rect(x + 7, y, 14, 14, color);
				rect(x - 3, y - 11, 14, 14, color);
				rect(x - 3, y + 10, 14, 14, color);
				rect(x, y, 8, 8, '#e9ac45');
			});
		}

		const health = { current: 100, max: 100 };

		function drawHealthBar() {
			const x = 42;
			const y = 38;
			const w = 320;
			const h = 40;
			const pct = Math.max(0, Math.min(1, health.current / health.max));
			const fillW = Math.round(w * pct);

			// Chunky dark pixel frame around the whole bar.
			rect(x - 6, y - 6, w + 12, h + 12, '#0b1210');
			rect(x - 3, y - 3, w + 6, h + 6, '#2c3a33');

			// Empty track underneath the fill.
			rect(x, y, w, h, '#3a1518');

			// Filled portion with a glossy highlight on top and a shaded strip on the bottom.
			rect(x, y, fillW, h, '#c93a3a');
			rect(x, y, fillW, Math.round(h * 0.4), '#e8615c');
			rect(x, y + h - Math.round(h * 0.22), fillW, Math.round(h * 0.22), '#8f2424');

			// Gold corner rivets, matching the rest of the pixel-UI palette.
			[[x - 6, y - 6], [x + w, y - 6], [x - 6, y + h], [x + w, y + h]].forEach(([cx, cy]) => {
				rect(cx, cy, 6, 6, '#d8c98a');
			});

			ctx.fillStyle = '#0b1210';
			ctx.font = 'bold 22px Courier New, monospace';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(`${health.current}/${health.max}`, x + w / 2 + 1, y + h / 2 + 2);
			ctx.fillStyle = '#ffffff';
			ctx.fillText(`${health.current}/${health.max}`, x + w / 2, y + h / 2 + 1);
		}

		function formatClock(ms) {
			const totalSec = Math.floor(ms / 1000);
			const m = Math.floor(totalSec / 60);
			const s = totalSec % 60;
			return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
		}

		function drawTimer() {
			const text = formatClock(elapsedMs);
			const w = 176;
			const h = 56;
			const x = W / 2 - w / 2;
			const y = 32;

			rect(x - 6, y - 6, w + 12, h + 12, '#0b1210');
			rect(x - 3, y - 3, w + 6, h + 6, '#2c3a33');
			rect(x, y, w, h, '#1f2d2b');
			[[x - 6, y - 6], [x + w, y - 6], [x - 6, y + h], [x + w, y + h]].forEach(([cx, cy]) => {
				rect(cx, cy, 6, 6, '#d8c98a');
			});

			ctx.fillStyle = '#0b1210';
			ctx.font = 'bold 30px Courier New, monospace';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(text, x + w / 2 + 1, y + h / 2 + 2);
			ctx.fillStyle = '#f4e8b5';
			ctx.fillText(text, x + w / 2, y + h / 2 + 1);
		}

		function drawXpBar() {
			const w = 760;
			const h = 34;
			const x = W / 2 - w / 2;
			const y = H - 76;
			const needed = playerLevel >= MAX_LEVEL ? 1 : xpToClearLevel(playerLevel);
			const pct = playerLevel >= MAX_LEVEL ? 1 : Math.max(0, Math.min(1, xpIntoLevel / needed));
			const fillW = Math.round(w * pct);

			rect(x - 6, y - 6, w + 12, h + 12, '#0b1210');
			rect(x - 3, y - 3, w + 6, h + 6, '#2c3a33');
			rect(x, y, w, h, '#1a2a26');
			rect(x, y, fillW, h, '#6fb3e0');
			rect(x, y, fillW, Math.round(h * 0.4), '#9ed4f2');
			[[x - 6, y - 6], [x + w, y - 6], [x - 6, y + h], [x + w, y + h]].forEach(([cx, cy]) => {
				rect(cx, cy, 6, 6, '#d8c98a');
			});

			ctx.textBaseline = 'middle';
			ctx.fillStyle = '#f4e8b5';
			ctx.font = 'bold 20px Courier New, monospace';
			ctx.textAlign = 'right';
			ctx.fillText(`Lv. ${playerLevel}  TOTAL EXP ${totalXP}`, x + w + 4, y - 20);

			const label = playerLevel >= MAX_LEVEL ? 'MAX LEVEL' : `${xpIntoLevel} / ${needed}`;
			ctx.textAlign = 'center';
			ctx.font = 'bold 16px Courier New, monospace';
			ctx.fillStyle = '#0b1210';
			ctx.fillText(label, x + w / 2 + 1, y + h / 2 + 2);
			ctx.fillStyle = '#ffffff';
			ctx.fillText(label, x + w / 2, y + h / 2 + 1);
		}

		function drawHud() {
			drawHealthBar();
			drawTimer();
			drawXpBar();
			drawSettingsButton();
			if (settingsOpen) drawSettingsPanel();
		}

		let settingsOpen = false;
		let settingsView = 'menu';

		// Builds an actual circular cog silhouette out of a chunky pixel grid
		// (radius test per cell + a cosine tooth wave), instead of an abstract
		// block pattern, so it reads clearly as a gear at a glance.
		function drawPixelGear(x, y, size = 56, cell = 4) {
			const dark = '#17252b';
			const face = '#e8e0b8';
			const rim = '#b8a878';
			const cells = size / cell;
			const cx = cells / 2;
			const cyc = cells / 2;
			const bodyR = cells / 2 - 1.6;
			const toothR = cells / 2 - 0.4;
			const holeR = cells * 0.16;
			const teeth = 8;

			for (let iy = 0; iy < cells; iy += 1) {
				for (let ix = 0; ix < cells; ix += 1) {
					const dx = ix - cx + 0.5;
					const dy = iy - cyc + 0.5;
					const dist = Math.sqrt(dx * dx + dy * dy);
					const angle = Math.atan2(dy, dx);
					const toothBump = Math.cos(angle * teeth) > 0.2;
					const outer = toothBump ? toothR : bodyR;

					let color = null;
					if (dist <= holeR) {
						color = dark;
					} else if (dist <= outer) {
						color = dist > outer - 1.3 ? rim : face;
					}
					if (color) rect(x + ix * cell, y + iy * cell, cell, cell, color);
				}
			}
		}

		function drawSettingsButton() {
			const x = W - 112;
			const y = 42;
			rect(x + 8, y, 64, 8, '#17252b');
			rect(x, y + 8, 8, 64, '#17252b');
			rect(x + 72, y + 8, 8, 64, '#17252b');
			rect(x + 8, y + 72, 64, 8, '#17252b');
			rect(x + 8, y + 8, 64, 64, settingsOpen ? '#d8c98a' : '#f0e5ba');
			drawPixelGear(x + 12, y + 12, 56, 4);
		}

		function drawButton(x, y, width, height, label, selected = false) {
			rect(x + 6, y, width - 12, 6, '#17252b');
			rect(x, y + 6, 6, height - 12, '#17252b');
			rect(x + width - 6, y + 6, 6, height - 12, '#17252b');
			rect(x + 6, y + height - 6, width - 12, 6, '#17252b');
			rect(x + 12, y + 12, width - 24, height - 24, selected ? '#e8d995' : '#c9bd87');
			ctx.fillStyle = '#202d2d';
			ctx.font = 'bold 26px Courier New, monospace';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(label, x + width / 2, y + height / 2 + 2);
		}

		function drawSettingsPanel() {
			const panelX = 650;
			const panelY = 230;
			const panelW = 620;
			const panelH = settingsView === 'ranking' ? 500 : 430;
			rect(0, 0, W, H, 'rgba(10, 22, 20, 0.42)');
			rect(panelX + 12, panelY, panelW - 24, 12, '#17252b');
			rect(panelX, panelY + 12, panelW, panelH - 24, '#17252b');
			rect(panelX + 12, panelY + panelH - 12, panelW - 24, 12, '#17252b');
			rect(panelX + 22, panelY + 22, panelW - 44, panelH - 44, '#87906c');
			rect(panelX + 34, panelY + 34, panelW - 68, 72, '#263734');
			ctx.fillStyle = '#f4e8b5';
			ctx.font = 'bold 34px Courier New, monospace';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(settingsView === 'ranking' ? 'RANKING' : 'SETTING', panelX + panelW / 2, panelY + 70);

			if (settingsView === 'ranking') {
				const rows = [['01', 'PLAYER', '009820'], ['02', 'MEADOW', '008460'], ['03', 'YOU', '000000']];
				rows.forEach(([rank, name, score], index) => {
					const rowY = panelY + 145 + index * 68;
					rect(panelX + 70, rowY, panelW - 140, 48, '#66785e');
					ctx.fillStyle = '#f4e8b5';
					ctx.font = 'bold 22px Courier New, monospace';
					ctx.textAlign = 'left';
					ctx.fillText(`${rank}  ${name}`, panelX + 92, rowY + 25);
					ctx.textAlign = 'right';
					ctx.fillText(score, panelX + panelW - 92, rowY + 25);
				});
				drawButton(panelX + 185, panelY + 370, 250, 64, 'BACK');
				return;
			}

			drawButton(panelX + 95, panelY + 145, 430, 70, 'RANKING');
			drawButton(panelX + 95, panelY + 240, 430, 70, 'EXIT');
			ctx.fillStyle = '#34433a';
			ctx.font = '18px Courier New, monospace';
			ctx.textAlign = 'center';
			ctx.fillText('ESC  CLOSE', panelX + panelW / 2, panelY + 370);
		}

		function canvasPoint(event) {
			const bounds = canvas.getBoundingClientRect();
			return {
				x: (event.clientX - bounds.left) * W / bounds.width,
				y: (event.clientY - bounds.top) * H / bounds.height,
			};
		}

		canvas.addEventListener('click', (event) => {
			const { x, y } = canvasPoint(event);
			const gearX = W - 112;
			if (x >= gearX && x <= gearX + 80 && y >= 42 && y <= 122) {
				settingsOpen = !settingsOpen;
				settingsView = 'menu';
				return;
			}

			if (!settingsOpen) return;
			const panelX = 650;
			if (settingsView === 'ranking') {
				if (x >= panelX + 185 && x <= panelX + 435 && y >= 600 && y <= 664) {
					settingsView = 'menu';
				}
				return;
			}

			if (x >= panelX + 95 && x <= panelX + 525 && y >= 375 && y <= 445) {
				settingsView = 'ranking';
			} else if (x >= panelX + 95 && x <= panelX + 525 && y >= 470 && y <= 540) {
				settingsOpen = false;
			}
		});

		window.addEventListener('keydown', (event) => {
			if (event.code === 'Escape' && settingsOpen) {
				settingsOpen = false;
				settingsView = 'menu';
			}
		});

		function drawScenery(targetCtx) {
			drawMeadow();
			pixelTree(200, 390, .6);
			pixelTree(1580, 430, .47);
			pixelTree(1780, 500, .35);
			drawFlowers();
		}

		// ===== Static background pre-render =====
		// The meadow/trees/flowers never change, so we paint them once onto an
		// offscreen canvas and just blit that each frame instead of redrawing
		// every rect every tick.
		const bgCanvas = document.createElement('canvas');
		bgCanvas.width = W;
		bgCanvas.height = H;
		const bgCtx = bgCanvas.getContext('2d');
		bgCtx.imageSmoothingEnabled = false;
		(function prerenderScenery() {
			const realCtx = ctx;
			ctx = bgCtx;
			drawScenery();
			ctx = realCtx;
		})();

		// ===== Character sprite =====
		const FRAME_SRC_SIZE = 128;
		const CHAR_DISPLAY_SIZE = 88; // 220 / 2.5
		const CHAR_SPEED = 152; // px / sec, scaled down with the character (380 / 2.5)

		const ANIMATIONS = {
			idle: { src: 'assets/idle_loop_strip.png', frames: 4, frameDuration: 180 },
			walkLeft: { src: 'assets/walk_left_strip.png', frames: 3, frameDuration: 110 },
			walkRight: { src: 'assets/walk_right_strip.png', frames: 3, frameDuration: 110 },
		};

		const sheets = {};
		Object.entries(ANIMATIONS).forEach(([name, anim]) => {
			const img = new Image();
			img.src = anim.src;
			sheets[name] = img;
		});

		const input = { left: false, right: false, up: false, down: false };

		window.addEventListener('keydown', (e) => {
			if (e.code === 'ArrowLeft') { input.left = true; e.preventDefault(); }
			if (e.code === 'ArrowRight') { input.right = true; e.preventDefault(); }
			if (e.code === 'ArrowUp') { input.up = true; e.preventDefault(); }
			if (e.code === 'ArrowDown') { input.down = true; e.preventDefault(); }
		});

		window.addEventListener('keyup', (e) => {
			if (e.code === 'ArrowLeft') input.left = false;
			if (e.code === 'ArrowRight') input.right = false;
			if (e.code === 'ArrowUp') input.up = false;
			if (e.code === 'ArrowDown') input.down = false;
		});

		const player = {
			x: W / 2,
			y: H / 2 + 90,
			facing: 'right', // last horizontal direction, used while walking straight up/down
			animName: 'idle',
			frameIndex: 0,
			frameElapsed: 0,
		};

		// ===== Level / XP =====
		// Level 1-100. XP needed to clear a level starts at 10 (level 1->2) and
		// goes up by 1 every level (level 2->3 needs 11, ... level 99->100 needs 108).
		// This part of the spec wasn't fully finished in the request, so this curve
		// is a placeholder - easy to retune by editing xpToClearLevel().
		const MAX_LEVEL = 100;
		let playerLevel = 1;
		let xpIntoLevel = 0; // progress toward the next level (resets on level-up)
		let totalXP = 0; // lifetime total, never resets - shown as the "총량"

		function xpToClearLevel(level) {
			return 10 + (level - 1);
		}

		function gainXP(amount) {
			totalXP += amount;
			if (playerLevel >= MAX_LEVEL) return;
			xpIntoLevel += amount;
			while (playerLevel < MAX_LEVEL && xpIntoLevel >= xpToClearLevel(playerLevel)) {
				xpIntoLevel -= xpToClearLevel(playerLevel);
				playerLevel += 1;
			}
			if (playerLevel >= MAX_LEVEL) {
				playerLevel = MAX_LEVEL;
				xpIntoLevel = 0;
			}
			maybeShowLevelCard();
		}

		// ===== Level-up cards (every 5 levels) =====
		// atk_speed: -20% attack interval (stacks multiplicatively).
		// extra_shot: +1 projectile per attack (stacks additively).
		// move_speed: +10% move speed (stacks multiplicatively).
		// full_heal: instant one-time full heal, no persistent effect.
		// damage_up: spell damage +5 flat (stacks additively).
		// pierce: +1 enemy a projectile can punch through (stacks additively).
		// Only offered as a possible option on levels that are multiples of 10,
		// and even then it's just one of the pool card.html rolls 3 from.
		let lastCardLevel = 0;
		let paused = false;
		let cardFrame = null;
		let attackIntervalMultiplier = 1;
		let moveSpeedMultiplier = 1;
		let damageBonus = 0;
		let extraProjectileCount = 0;
		let pierceCount = 0;

		function maybeShowLevelCard() {
			if (playerLevel > lastCardLevel && playerLevel % 5 === 0) {
				lastCardLevel = playerLevel;
				showLevelCard();
			}
		}

		function showLevelCard() {
			paused = true;
			cardFrame = document.createElement('iframe');
			const offerPierce = playerLevel % 10 === 0;
			cardFrame.src = 'card.html' + (offerPierce ? '?pierce=1' : '');
			cardFrame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1000;';
			document.body.appendChild(cardFrame);
		}

		function applyCardUpgrade(key) {
			if (key === 'atk_speed') attackIntervalMultiplier *= 0.8;
			else if (key === 'extra_shot') extraProjectileCount += 1;
			else if (key === 'move_speed') moveSpeedMultiplier *= 1.1;
			else if (key === 'full_heal') health.current = health.max;
			else if (key === 'damage_up') damageBonus += 5;
			else if (key === 'pierce') pierceCount += 1;
		}

		window.addEventListener('message', (event) => {
			const data = event.data;
			if (!data || data.source !== 'level-card') return;
			applyCardUpgrade(data.key);
			if (cardFrame) {
				cardFrame.remove();
				cardFrame = null;
			}
			paused = false;
			lastTime = performance.now(); // avoid a huge dt spike from the paused time
			requestAnimationFrame(tick);
		});

		function setAnimation(name) {
			if (player.animName === name) return;
			player.animName = name;
			player.frameIndex = 0;
			player.frameElapsed = 0;
		}

		function updateState() {
			if (input.left && !input.right) {
				player.facing = 'left';
				setAnimation('walkLeft');
			} else if (input.right && !input.left) {
				player.facing = 'right';
				setAnimation('walkRight');
			} else if (input.up || input.down) {
				// No dedicated up/down sprite: keep walking on the last horizontal facing.
				setAnimation(player.facing === 'left' ? 'walkLeft' : 'walkRight');
			} else {
				setAnimation('idle');
			}
		}

		function updateMovement(dt) {
			const half = CHAR_DISPLAY_SIZE / 2;
			const dist = (CHAR_SPEED * moveSpeedMultiplier * dt) / 1000;

			let dx = 0;
			let dy = 0;
			if (input.left && !input.right) dx -= 1;
			if (input.right && !input.left) dx += 1;
			if (input.up && !input.down) dy -= 1;
			if (input.down && !input.up) dy += 1;

			if (dx !== 0 && dy !== 0) {
				const norm = Math.SQRT1_2; // keep diagonal speed equal to axis-aligned speed
				dx *= norm;
				dy *= norm;
			}

			player.x = Math.min(W - half, Math.max(half, player.x + dx * dist));
			player.y = Math.min(H - half, Math.max(half, player.y + dy * dist));
		}

		function updateAnimation(dt) {
			const anim = ANIMATIONS[player.animName];
			player.frameElapsed += dt;
			while (player.frameElapsed >= anim.frameDuration) {
				player.frameElapsed -= anim.frameDuration;
				player.frameIndex = (player.frameIndex + 1) % anim.frames;
			}
		}

		// idle_loop_strip.png frame 1 (the resting pose) is drawn ~11% taller/wider
		// than frames 2-4 (the breathing motion), which makes the loop visibly
		// "pop" in size every cycle. Frames 2-4 already match each other closely,
		// so only frame 1 needs correcting back down to their scale.
		const IDLE_FRAME_SCALE = [0.89, 1, 1, 1];

		function drawPlayer() {
			const sheet = sheets[player.animName];
			if (!sheet.complete || sheet.naturalWidth === 0) return;
			const sx = player.frameIndex * FRAME_SRC_SIZE;
			const scale = player.animName === 'idle' ? IDLE_FRAME_SCALE[player.frameIndex] : 1;
			const size = CHAR_DISPLAY_SIZE * scale;
			const bottom = player.y + CHAR_DISPLAY_SIZE / 2; // keep feet planted while size is corrected

			// Flicker while invulnerable so the 0.5s hit-immunity window is visible.
			const flickering = playerInvulnMs > 0 && Math.floor(playerInvulnMs / 80) % 2 === 0;
			ctx.globalAlpha = flickering ? 0.35 : 1;
			ctx.drawImage(
				sheet,
				sx, 0, FRAME_SRC_SIZE, FRAME_SRC_SIZE,
				player.x - size / 2, bottom - size,
				size, size
			);
			ctx.globalAlpha = 1;
		}

		// ===== Slimes =====
		// Green (normal) slimes appear from the start. Poison joins in at 3:00,
		// ice joins in at 5:00 (earlier types keep spawning too - it stacks).
		// The live-slime cap starts at 10 and grows by 10 every 30 seconds; the
		// actual number on screen at any moment is randomized up to that cap.
		const SLIME_FRAME_SIZE = 128;
		const SLIME_DISPLAY_SIZE = 64;
		const SLIME_SPEED = 70; // px / sec, chases the player - slower than the player's 152

		const SLIME_BOUNCE = [
			{ duration: 520, y: 0 },
			{ duration: 90, y: 3 },
			{ duration: 160, y: -16 },
			{ duration: 110, y: 2 },
		];

		// normal appears from the start, poison joins at 1:30, ice joins at 3:00 -
		// once unlocked a type keeps spawning alongside the others (mixed pool).
		const SLIME_TYPES = {
			normal: { src: 'assets/slime_normal_strip.png', unlockMs: 0, hp: 20, xp: 3 },
			poison: { src: 'assets/slime_poison_strip.png', unlockMs: 90 * 1000, hp: 40, xp: 6 },
			ice: { src: 'assets/slime_ice_strip.png', unlockMs: 3 * 60 * 1000, hp: 80, xp: 9 },
		};

		const slimeSheets = {};
		Object.entries(SLIME_TYPES).forEach(([key, type]) => {
			const img = new Image();
			img.src = type.src;
			slimeSheets[key] = img;
		});

		let elapsedMs = 0;
		let slimes = [];
		let nextSpawnCheck = 0;
		let nextSlimeId = 1;

		function unlockedSlimeTypes() {
			return Object.keys(SLIME_TYPES).filter((key) => elapsedMs >= SLIME_TYPES[key].unlockMs);
		}

		function currentSlimeCap() {
			return 10 + 10 * Math.floor(elapsedMs / 30000);
		}

		// Boss slimes reuse a regular slime's art/type (whichever are currently
		// unlocked) but 3x the display size - hitbox and HP/XP scale along with
		// it (10x stats), which puts a normal-boss at 200 HP, poison-boss at
		// 400 HP, ice-boss at 800 HP.
		const BOSS_SIZE_MULTIPLIER = 3;
		const BOSS_STAT_MULTIPLIER = 10;

		function spawnSlime(isBoss = false) {
			const types = unlockedSlimeTypes();
			const type = types[Math.floor(Math.random() * types.length)];
			// Spawn just outside a random edge so it visibly walks onto the field.
			const margin = isBoss ? SLIME_DISPLAY_SIZE * BOSS_SIZE_MULTIPLIER : 50;
			const edge = Math.floor(Math.random() * 4);
			let x;
			let y;
			if (edge === 0) { x = Math.random() * W; y = -margin; }
			else if (edge === 1) { x = W + margin; y = Math.random() * H; }
			else if (edge === 2) { x = Math.random() * W; y = H + margin; }
			else { x = -margin; y = Math.random() * H; }

			const base = SLIME_TYPES[type];
			const size = isBoss ? SLIME_DISPLAY_SIZE * BOSS_SIZE_MULTIPLIER : SLIME_DISPLAY_SIZE;
			const hp = isBoss ? base.hp * BOSS_STAT_MULTIPLIER : base.hp;
			const xp = isBoss ? base.xp * BOSS_STAT_MULTIPLIER : base.xp;

			slimes.push({ id: nextSlimeId++, type, x, y, facing: 1, frameIndex: 0, frameElapsed: 0, hp, xp, size, isBoss });
		}

		function updateSlimeSpawning(dt) {
			nextSpawnCheck -= dt;
			if (nextSpawnCheck > 0) return;
			nextSpawnCheck = 800 + Math.random() * 1200; // re-roll the target every ~0.8-2s

			const cap = currentSlimeCap();
			if (slimes.length >= cap) return;
			const target = Math.floor(Math.random() * (cap + 1));
			const toSpawn = Math.max(0, target - slimes.length);
			for (let i = 0; i < toSpawn; i += 1) spawnSlime();
		}

		// A boss spawns every 60s on the dot, on top of the regular cap (it
		// isn't blocked by currentSlimeCap() - it's a guaranteed extra spawn).
		const BOSS_SPAWN_INTERVAL_MS = 60 * 1000;
		let bossSpawnTimer = BOSS_SPAWN_INTERVAL_MS;

		function updateBossSpawning(dt) {
			bossSpawnTimer -= dt;
			if (bossSpawnTimer > 0) return;
			bossSpawnTimer = BOSS_SPAWN_INTERVAL_MS;
			spawnSlime(true);
		}

		function updateSlimes(dt) {
			slimes.forEach((s) => {
				const dx = player.x - s.x;
				const dy = player.y - s.y;
				const dist = Math.hypot(dx, dy) || 1;
				const step = (SLIME_SPEED * dt) / 1000;
				s.x += (dx / dist) * step;
				s.y += (dy / dist) * step;
				if (Math.abs(dx) > 2) s.facing = dx < 0 ? -1 : 1;

				s.frameElapsed += dt;
				while (s.frameElapsed >= SLIME_BOUNCE[s.frameIndex].duration) {
					s.frameElapsed -= SLIME_BOUNCE[s.frameIndex].duration;
					s.frameIndex = (s.frameIndex + 1) % SLIME_BOUNCE.length;
				}
			});
		}

		// ===== Slime collision =====
		const SLIME_DAMAGE = 5;
		const HIT_INVULN_MS = 500;
		let playerInvulnMs = 0;

		function updateCollisions(dt) {
			if (playerInvulnMs > 0) {
				playerInvulnMs = Math.max(0, playerInvulnMs - dt);
				return; // still immune from the last hit - can't take damage again yet
			}

			for (const s of slimes) {
				const hitRadius = CHAR_DISPLAY_SIZE * 0.35 + s.size * 0.35;
				const dx = player.x - s.x;
				const dy = player.y - (s.y - s.size / 2); // compare center-to-center
				if (Math.hypot(dx, dy) <= hitRadius) {
					health.current = Math.max(0, health.current - SLIME_DAMAGE);
					playerInvulnMs = HIT_INVULN_MS;
					if (health.current <= 0) triggerGameOver();
					break; // one hit per invulnerability window, even if several slimes are touching
				}
			}
		}

		let gameOver = false;

		function triggerGameOver() {
			if (gameOver) return;
			gameOver = true;
			sessionStorage.setItem('lastSurvivalMs', String(Math.floor(elapsedMs)));
			window.location.href = 'gameover_screen.html';
		}

		function drawSlimes() {
			slimes.forEach((s) => {
				const sheet = slimeSheets[s.type];
				if (!sheet.complete || sheet.naturalWidth === 0) return;
				const frame = SLIME_BOUNCE[s.frameIndex];
				const sx = s.frameIndex * SLIME_FRAME_SIZE;
				const size = s.size;
				const bottom = s.y + frame.y;

				if (s.isBoss) {
					// Menacing red glow behind the boss so it reads as dangerous
					// from a distance, plus a floating "BOSS" tag above it.
					const glowRadius = size * 0.6;
					const grad = ctx.createRadialGradient(s.x, bottom - size / 2, size * 0.1, s.x, bottom - size / 2, glowRadius);
					grad.addColorStop(0, 'rgba(220, 60, 60, 0.45)');
					grad.addColorStop(1, 'rgba(220, 60, 60, 0)');
					ctx.fillStyle = grad;
					ctx.fillRect(s.x - glowRadius, bottom - size - glowRadius / 2, glowRadius * 2, glowRadius * 2 + size);

					ctx.fillStyle = '#ffd76a';
					ctx.font = 'bold 18px Courier New, monospace';
					ctx.textAlign = 'center';
					ctx.textBaseline = 'middle';
					ctx.fillText('BOSS', s.x, bottom - size - 14);
				}

				ctx.save();
				ctx.translate(s.x, 0);
				if (s.facing < 0) ctx.scale(-1, 1);
				ctx.drawImage(
					sheet,
					sx, 0, SLIME_FRAME_SIZE, SLIME_FRAME_SIZE,
					-size / 2, bottom - size,
					size, size
				);
				ctx.restore();
			});
		}

		function killSlime(index) {
			const s = slimes[index];
			gainXP(s.xp);
			slimes.splice(index, 1);
		}

		// ===== Spells (auto-attack) =====
		// Level < 30: dark orb (one-shots normal, 2 hits to kill poison).
		// Level 30-49: demon flame (one-shots poison, 2 hits to kill ice).
		// Level 50+: void shard (one-shots ice).
		const SPELL_FRAME_SIZE = 128;
		const SPELL_DISPLAY_SIZE = 60; // 40 * 1.5
		const PROJECTILE_SPEED = 460; // px / sec
		const PROJECTILE_MAX_LIFE_MS = 1500;
		const ATTACK_INTERVAL_MS = 700;

		const SPELLS = {
			dark_orb: { src: 'assets/dark_orb_strip.png', damage: 10, minLevel: 1 },
			demon_flame: { src: 'assets/demon_flame_strip.png', damage: 20, minLevel: 30 },
			void_shard: { src: 'assets/void_shard_strip.png', damage: 40, minLevel: 50 },
		};

		const spellSheets = {};
		Object.entries(SPELLS).forEach(([key, spell]) => {
			const img = new Image();
			img.src = spell.src;
			spellSheets[key] = img;
		});

		function currentSpellKey() {
			if (playerLevel >= 50) return 'void_shard';
			if (playerLevel >= 30) return 'demon_flame';
			return 'dark_orb';
		}

		let attackCooldownMs = 0;
		let projectiles = [];

		function findNearestSlime() {
			let nearest = null;
			let nearestDist = Infinity;
			slimes.forEach((s) => {
				const d = Math.hypot(player.x - s.x, player.y - (s.y - s.size / 2));
				if (d < nearestDist) {
					nearestDist = d;
					nearest = s;
				}
			});
			return nearest;
		}

		function fireSpell() {
			const target = findNearestSlime();
			if (!target) return;

			const spellKey = currentSpellKey();
			const spell = SPELLS[spellKey];
			const baseAngle = Math.atan2(
				(target.y - target.size / 2) - player.y,
				target.x - player.x
			);

			// Extra projectiles fan out in a small spread around the aim angle
			// instead of stacking exactly on top of each other.
			const shotCount = 1 + extraProjectileCount;
			const spreadStep = 0.18; // radians between adjacent shots
			const startOffset = -((shotCount - 1) / 2) * spreadStep;

			for (let i = 0; i < shotCount; i += 1) {
				const angle = baseAngle + startOffset + i * spreadStep;
				projectiles.push({
					spellKey,
					damage: spell.damage + damageBonus,
					x: player.x,
					y: player.y,
					vx: Math.cos(angle) * PROJECTILE_SPEED,
					vy: Math.sin(angle) * PROJECTILE_SPEED,
					life: PROJECTILE_MAX_LIFE_MS,
					pierceLeft: pierceCount, // extra hits beyond the first before it's spent
					hitIds: [],
				});
			}
		}

		function updateAttacks(dt) {
			attackCooldownMs -= dt;
			if (attackCooldownMs <= 0 && slimes.length > 0) {
				fireSpell();
				attackCooldownMs = ATTACK_INTERVAL_MS * attackIntervalMultiplier;
			}
		}

		function updateProjectiles(dt) {
			for (let i = projectiles.length - 1; i >= 0; i -= 1) {
				const p = projectiles[i];
				p.x += (p.vx * dt) / 1000;
				p.y += (p.vy * dt) / 1000;
				p.life -= dt;

				if (p.life <= 0 || p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) {
					projectiles.splice(i, 1);
					continue;
				}

				for (let j = slimes.length - 1; j >= 0; j -= 1) {
					const s = slimes[j];
					if (p.hitIds.includes(s.id)) continue; // already pierced through this one
					const hitRadius = SPELL_DISPLAY_SIZE * 0.35 + s.size * 0.35;
					const dist = Math.hypot(p.x - s.x, p.y - (s.y - s.size / 2));
					if (dist <= hitRadius) {
						s.hp -= p.damage;
						p.hitIds.push(s.id);
						if (s.hp <= 0) killSlime(j);

						if (p.pierceLeft > 0) {
							p.pierceLeft -= 1; // keep flying, can hit another enemy
						} else {
							projectiles.splice(i, 1);
						}
						break;
					}
				}
			}
		}

		function drawProjectiles() {
			projectiles.forEach((p) => {
				const sheet = spellSheets[p.spellKey];
				if (!sheet.complete || sheet.naturalWidth === 0) return;
				const size = SPELL_DISPLAY_SIZE;
				// Frame 2 (fully "charged") is used as the flying orb look.
				const sx = 2 * SPELL_FRAME_SIZE;
				ctx.save();
				ctx.shadowColor = 'rgba(190, 140, 255, 0.9)';
				ctx.shadowBlur = 14;
				ctx.drawImage(
					sheet,
					sx, 0, SPELL_FRAME_SIZE, SPELL_FRAME_SIZE,
					p.x - size / 2, p.y - size / 2,
					size, size
				);
				ctx.restore();
			});
		}

		function draw() {
			ctx.drawImage(bgCanvas, 0, 0);
			drawSlimes();
			drawProjectiles();
			drawPlayer();
			drawHud();
		}

		let lastTime = performance.now();

		function tick(now) {
			if (gameOver) return; // stop the loop once we're on our way to the game-over screen
			if (paused) return; // frozen while a level-up card is showing

			const dt = Math.min(50, now - lastTime); // guard against huge jumps (e.g. tab switch)
			lastTime = now;

			elapsedMs += dt;
			updateState();
			updateMovement(dt);
			updateAnimation(dt);
			updateSlimeSpawning(dt);
			updateBossSpawning(dt);
			updateSlimes(dt);
			updateCollisions(dt);
			updateAttacks(dt);
			updateProjectiles(dt);
			draw();

			requestAnimationFrame(tick);
		}

		requestAnimationFrame(tick);
	</script>
</body>
</html>

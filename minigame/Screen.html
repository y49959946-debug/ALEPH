<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LUMORIA</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
	<style>
		:root {
			background: #142b2a;
			color: #fff;
			font-family: "Courier New", monospace;
		}

		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #142b2a;
		}

		body {
			display: grid;
			place-items: center;
		}

		#game {
			display: block;
			width: min(100vw, 177.7778vh);
			height: min(56.25vw, 100vh);
			cursor: crosshair;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			background: #82c9db;
			box-shadow: 0 0 0 8px #0a1719, 0 18px 50px rgba(0, 0, 0, .42);
		}
	</style>
</head>
<body>
	<canvas id="game" width="1920" height="1080" aria-label="LUMORIA 게임 화면: 마법사를 WASD로 움직여 몰려오는 슬라임을 피하며 자동 마법으로 처치"></canvas>

	<script>
		// Require a name before playing - if someone lands here directly
		// without going through name_entry.html, send them back there.
		// ===== 저장값 (T02 카드 4) =====
		// 현재 판 값(체력·시간·레벨·슬라임)은 메모리에만 두고 새 판마다 처음부터.
		// 보존 기록은 localStorage의 이름·랭킹·설정·플레이 기록 4가지뿐.
		// 저장소가 막혀 있거나 값이 깨져 있어도 게임은 멈추지 않고 기본값으로 시작.
		const store = {
			get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
			set(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; } },
			json(key, fallback) {
				try { const v = JSON.parse(this.get(key)); return v === null || v === undefined ? fallback : v; } catch (e) { return fallback; }
			},
		};
		const session = {
			set(key, value) { try { window.sessionStorage.setItem(key, value); } catch (e) {} },
		};
		const storageOk = store.set('__lumoria_test', '1');

		const rawName = store.get('playerName');
		const playerName = (typeof rawName === 'string' && rawName.trim()) ? rawName.trim().slice(0, 10) : '플레이어';
		if (storageOk && !(typeof rawName === 'string' && rawName.trim())) {
			window.location.href = 'name_entry.html';
		}

		const canvas = document.querySelector('#game');
		let ctx = canvas.getContext('2d');
		ctx.imageSmoothingEnabled = false;

		const W = canvas.width;
		const H = canvas.height;

		function rect(x, y, width, height, color) {
			ctx.fillStyle = color;
			ctx.fillRect(x, y, width, height);
		}

		// ===== 디자인 팔레트 (리디자인 시안 기준) =====
		const UI = {
			out: '#06080f', navy: '#0f1729', navy2: '#18233c', navy3: '#22304f',
			gold: '#d9a54a', goldHi: '#f6d784', goldDk: '#7a4a12',
			violet: '#8f5cf0', violetHi: '#d6b4ff', violetDk: '#4a2588',
			cream: '#f6e6bf', red: '#c93a4a', redHi: '#ff7b86', redDk: '#7a1c2a',
		};
		const FONT = '"Galmuri11", "Courier New", monospace';
		// ===== 효과 설정 (T02 카드 5) =====
		// 선언한 효과 사건: "플레이어가 피격되어 체력이 깎이는 순간" 하나뿐.
		//   → 피격음 + 화면 흔들림(0.22초) + 붉은 번쩍임(0.18초). 다른 사건에서는 실행되지 않음.
		// 메뉴의 "효과음"·"움직임 줄이기" 또는 M 키로 즉시 끄거나 줄일 수 있고, 선택은 보존 기록에 저장.
		const SETTINGS_KEY = 'lumoriaSettings';
		const systemReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		const savedSettings = store.json(SETTINGS_KEY, {});
		const settings = {
			sound: typeof savedSettings.sound === 'boolean' ? savedSettings.sound : true,
			reduceMotion: typeof savedSettings.reduceMotion === 'boolean' ? savedSettings.reduceMotion : systemReduce,
		};
		let reduceMotion = settings.reduceMotion;
		function saveSettings() { store.set(SETTINGS_KEY, JSON.stringify(settings)); }

		let audioCtx = null;
		let masterGain = null;
		function ensureAudio() {
			if (audioCtx) return;
			try {
				audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				masterGain = audioCtx.createGain();
				masterGain.gain.value = settings.sound ? 0.25 : 0;
				masterGain.connect(audioCtx.destination);
			} catch (e) { audioCtx = null; }
		}
		function setSound(on) {
			settings.sound = on;
			saveSettings();
			if (masterGain) {
				masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
				masterGain.gain.value = on ? 0.25 : 0; // 재생 중인 소리도 즉시 0
			}
		}
		function setReduceMotion(on) {
			settings.reduceMotion = on;
			reduceMotion = on;
			saveSettings();
			if (on) { shakeMs = 0; } // 진행 중인 흔들림도 즉시 멈춤
		}

		let shakeMs = 0;
		let flashMs = 0;
		function playEffect(kind) {
			if (kind !== 'hit') return; // 선언한 사건(피격) 외에는 효과 없음
			if (settings.sound && audioCtx && masterGain) {
				const t = audioCtx.currentTime;
				const osc = audioCtx.createOscillator();
				const g = audioCtx.createGain();
				osc.type = 'square';
				osc.frequency.setValueAtTime(330, t);
				osc.frequency.exponentialRampToValueAtTime(90, t + 0.14);
				g.gain.setValueAtTime(0.6, t);
				g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
				osc.connect(g); g.connect(masterGain);
				osc.start(t); osc.stop(t + 0.17);
			}
			flashMs = 180;
			shakeMs = reduceMotion ? 0 : 220;
		}

		// 고정 시드 난수 (떠다니는 입자 위치용)
		function seeded(seed) {
			let s = seed;
			return () => (s = (s * 9301 + 49297) % 233280) / 233280;
		}

		// 배경: 밤의 숲 이미지 (assets/bg_forest.png)
		const bgImage = new Image();
		bgImage.src = 'assets/bg_forest.png';

		// ===== 시안 스타일 UI 프레임 =====
		// 모서리를 깎은 사각형(픽셀풍)
		function cutRect(x, y, w, h, color, cut) {
			rect(x + cut, y, w - cut * 2, h, color);
			rect(x, y + cut, w, h - cut * 2, color);
			if (cut >= 4) rect(x + cut / 2, y + cut / 2, w - cut, h - cut, color);
		}

		// 계단식 마름모: 바깥 어두운 선 → 금 테 → 보라 보석 → 밝은 반짝임
		function drawDiamond(cx, cy, r, gem = true) {
			const layer = (rr, color) => {
				for (let dy = -rr; dy < rr; dy += 2) {
					const half = rr - Math.abs(dy + 1);
					if (half > 0) rect(cx - half, cy + dy, half * 2, 2, color);
				}
			};
			layer(r + 3, UI.out);
			layer(r, UI.gold);
			if (gem) {
				layer(r - 3, UI.violetDk);
				layer(r - 5, UI.violet);
				rect(cx - 2, cy - r + 6, 2, 2, UI.violetHi);
				rect(cx - 4, cy - r + 8, 2, 2, UI.violetHi);
			}
		}

		// 금색 덩굴 장식(가운데 보석 양옆)
		function drawFiligree(cx, cy, dir) {
			rect(cx + dir * 8, cy - 1, dir * 22, 2, UI.gold);
			rect(cx + dir * 30, cy - 4, dir * 4, 4, UI.gold);
			rect(cx + dir * 34, cy - 6, dir * 6, 2, UI.goldDk);
		}

		function drawGem(cx, cy, s = 1) { drawDiamond(cx, cy, 8 * s); }

		function drawFrame(x, y, w, h, opts = {}) {
			const { fill = UI.navy, caps = true, centerGems = false, cornerGems = false, glow = false } = opts;
			cutRect(x - 6, y - 6, w + 12, h + 12, UI.out, 8);
			cutRect(x - 4, y - 4, w + 8, h + 8, UI.gold, 6);
			rect(x + 2, y - 4, w - 4, 1, UI.goldHi);
			cutRect(x - 2, y - 2, w + 4, h + 4, UI.out, 4);
			cutRect(x, y, w, h, glow ? '#3a1d6e' : fill, 3);
			rect(x + 3, y, w - 6, 2, glow ? UI.violet : UI.navy3);
			if (caps) {
				const r = Math.min(14, Math.round(h / 2) + 2);
				rect(x - 12, y + h / 2 - 2, 8, 4, UI.gold);
				rect(x + w + 4, y + h / 2 - 2, 8, 4, UI.gold);
				drawDiamond(x - 16, y + h / 2, r);
				drawDiamond(x + w + 16, y + h / 2, r);
			}
			if (centerGems) {
				[y - 4, y + h + 4].forEach((gy) => {
					drawFiligree(x + w / 2, gy, -1);
					drawFiligree(x + w / 2, gy, 1);
					drawDiamond(x + w / 2, gy, 10);
				});
			}
			if (cornerGems) {
				[[x - 3, y - 3], [x + w + 3, y - 3], [x - 3, y + h + 3], [x + w + 3, y + h + 3]].forEach(([gx, gy]) => drawDiamond(gx, gy, 8));
			}
		}

		// 타이머 양옆 보라 반짝이
		function drawSparkle(cx, cy, s = 1) {
			const arm = (len, thick, color) => {
				rect(cx - thick / 2, cy - len, thick, len * 2, color);
				rect(cx - len, cy - thick / 2, len * 2, thick, color);
			};
			arm(18 * s, 2, UI.violet);
			arm(11 * s, 4, UI.violet);
			arm(6 * s, 6, UI.violetHi);
			rect(cx - 2, cy - 2, 4, 4, '#ffffff');
			[[-14, -14], [14, -14], [-14, 14], [14, 14]].forEach(([dx, dy], i) => {
				if (i % 3 === 0) return;
				const px = cx + dx * s, py = cy + dy * s;
				rect(px - 1, py - 4, 2, 8, UI.goldHi);
				rect(px - 4, py - 1, 8, 2, UI.goldHi);
			});
		}

		function shadowText(text, x, y, size, color = UI.cream, align = 'center') {
			ctx.font = `700 ${size}px ${FONT}`;
			ctx.textAlign = align;
			ctx.textBaseline = 'middle';
			ctx.fillStyle = UI.out;
			ctx.fillText(text, x + 2, y + 2);
			ctx.fillStyle = color;
			ctx.fillText(text, x, y);
		}

		function drawHeart(x, y, s = 3) {
			const rows = ['01100110', '11111111', '11111111', '01111110', '00111100', '00011000'];
			rows.forEach((row, ry) => [...row].forEach((c, rx) => {
				if (c === '1') rect(x + rx * s, y + ry * s, s, s, ry < 2 && rx < 3 ? '#d9a6ff' : '#9b4dff');
			}));
			rect(x + s, y + s, s, s, '#f3e0ff');
		}

		const health = { current: 100, max: 100 };

		function drawHealthBar() {
			const x = 46, y = 40, w = 340, h = 34;
			const pct = Math.max(0, Math.min(1, health.current / health.max));
			drawFrame(x, y, w, h, { centerGems: true });
			const fx = x + 4, fw = w - 8, fy = y + 4, fh = h - 8;
			cutRect(fx, fy, fw, fh, '#2a0f18', 3);
			const fill = Math.round(fw * pct);
			if (fill > 0) {
				cutRect(fx, fy, fill, fh, UI.red, 3);
				rect(fx + 3, fy + 2, Math.max(0, fill - 6), 6, UI.redHi);
				rect(fx + 3, fy + fh - 5, Math.max(0, fill - 6), 3, UI.redDk);
			}
			drawHeart(x + 12, y + 6, 3);
			shadowText(`${health.current}/${health.max}`, x + w / 2 + 10, y + h / 2 + 1, 22);
		}

		function formatClock(ms) {
			const totalMs = Math.max(0, Math.floor(ms));
			const m = Math.floor(totalMs / 60000);
			const s = Math.floor(totalMs / 1000) % 60;
			const msPart = totalMs % 1000;
			return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(msPart).padStart(3, '0')}`;
		}

		function drawTimer() {
			const w = 250, h = 58, x = W / 2 - w / 2, y = 28;
			drawFrame(x, y, w, h, { caps: false, centerGems: true });
			drawSparkle(x - 42, y + h / 2, 1);
			drawSparkle(x + w + 42, y + h / 2, 1);
			shadowText(formatClock(elapsedMs), W / 2, y + h / 2 + 1, 28, UI.cream);
		}

		function drawXpBar() {
			const w = 780, h = 30, x = W / 2 - w / 2, y = H - 74;
			const needed = playerLevel >= MAX_LEVEL ? 1 : xpToClearLevel(playerLevel);
			const pct = playerLevel >= MAX_LEVEL ? 1 : Math.max(0, Math.min(1, xpIntoLevel / needed));
			drawFrame(x, y, w, h, { centerGems: true, fill: '#140b28' });
			const fill = Math.round((w - 8) * pct);
			if (fill > 0) {
				cutRect(x + 4, y + 4, fill, h - 8, '#6b36c6', 2);
				rect(x + 6, y + 6, Math.max(0, fill - 4), 4, '#b57bff');
			}
			shadowText(playerLevel >= MAX_LEVEL ? 'MAX LEVEL' : `${xpIntoLevel} / ${needed}`, W / 2, y + h / 2 + 1, 18);
			shadowText(`Lv. ${playerLevel}   TOTAL EXP ${totalXP}`, x + w - 10, y - 30, 18, UI.goldHi, 'right');
		}

		function drawPlayerName() {
			shadowText(playerName, 50, 100, 16, UI.cream, 'left');
		}

		// 현재 게임 상태 한 줄 (T02 C05)
		function statusText() {
			if (!started) return '시작 대기';
			if (settingsOpen) return pausedByBlur ? '일시정지 — 창을 벗어났어요' : '일시정지';
			if (cardFrame) return '레벨업 — 카드를 고르세요';
			if (finalWaveSpawned) return `마지막 보스! 남은 적 ${slimes.length} — 모두 처치하면 클리어`;
			return `진행 중 — 마지막 보스까지 ${Math.max(0, Math.ceil((FINAL_WAVE_MS - elapsedMs) / 1000))}초`;
		}

		function drawStatus() {
			const text = statusText();
			ctx.font = `700 18px ${FONT}`;
			const w = Math.ceil(ctx.measureText(text).width) + 36;
			const x = W / 2 - w / 2, y = 112;
			cutRect(x, y, w, 32, 'rgba(10, 14, 28, .82)', 3);
			rect(x, y + 30, w, 2, finalWaveSpawned ? UI.red : UI.violet);
			shadowText(text, W / 2, y + 16, 18, finalWaveSpawned ? '#ffd0d6' : UI.cream);
		}

		// 조작 안내 (항상 보임, T02 C04)
		function drawControlsHint() {
			const text = 'WASD 이동 · 공격 자동 · ESC 메뉴 · M 소리';
			ctx.font = `700 16px ${FONT}`;
			const w = Math.ceil(ctx.measureText(text).width) + 28;
			cutRect(24, H - 52, w, 30, 'rgba(10, 14, 28, .78)', 3);
			shadowText(text, 24 + w / 2, H - 37, 16, '#cbbbe6');
		}

		const START_BTN = { key: 'start', label: '시작하기  (Enter)', x: W / 2 - 190, y: 778, w: 380, h: 68 };
		function drawStartPanel() {
			ctx.fillStyle = 'rgba(4, 6, 16, 0.70)';
			ctx.fillRect(0, 0, W, H);
			const x = 500, y = 170, w = 920, h = 720;
			drawFrame(x, y, w, h, { caps: false, centerGems: true, cornerGems: true, fill: '#0d1424' });
			shadowText('LUMORIA', W / 2, y + 70, 54, UI.goldHi);
			shadowText(`${playerName}님, 30초 판을 시작합니다`, W / 2, y + 130, 22, UI.cream);
			const lines = [
				['규칙', ''],
				['', '· 사방에서 슬라임이 몰려와요. 닿으면 체력이 깎여요.'],
				['', '· 마법은 가장 가까운 적에게 자동으로 날아가요.'],
				['', '· 0:07 보스 등장, 0:15 마지막 보스 등장.'],
				['', '· 마지막 보스 뒤엔 새 슬라임이 멈추고 남은 적이 돌진해요.'],
				['', '· 남은 적을 모두 처치하면 클리어, 체력이 0이 되면 실패.'],
				['조작', ''],
				['', '· WASD 이동   · ESC 일시정지/메뉴   · M 소리 끄기·켜기'],
				['', '· 레벨업 카드: 클릭 또는 숫자 1·2·3'],
			];
			let ly = y + 190;
			lines.forEach(([head, body]) => {
				if (head) { shadowText(head, x + 90, ly, 24, UI.goldHi, 'left'); ly += 40; }
				else { shadowText(body, x + 110, ly, 21, UI.cream, 'left'); ly += 38; }
			});
			drawFrame(START_BTN.x, START_BTN.y, START_BTN.w, START_BTN.h, { glow: true });
			shadowText(START_BTN.label, W / 2, START_BTN.y + START_BTN.h / 2 + 1, 26, '#ffffff');
		}

		function drawHud() {
			drawHealthBar();
			drawPlayerName();
			drawTimer();
			drawStatus();
			drawXpBar();
			drawControlsHint();
			drawSettingsButton();
			if (settingsOpen) drawSettingsPanel();
			if (!started) drawStartPanel();
		}

		let settingsOpen = false;
		let settingsView = 'menu';
		let hoverKey = null;

		// 메뉴 버튼(☰) 위치 — 그리기와 클릭 판정이 같은 값을 씀
		const MENU_BTN = { x: W - 112, y: 34, w: 72, h: 72 };

		function drawSettingsButton() {
			const { x, y, w, h } = MENU_BTN;
			drawFrame(x, y, w, h, { caps: false, cornerGems: true, glow: settingsOpen || hoverKey === 'menuBtn' });
			for (let i = 0; i < 3; i += 1) {
				rect(x + 16, y + 20 + i * 13, w - 32, 7, UI.goldHi);
				rect(x + 16, y + 25 + i * 13, w - 32, 2, UI.goldDk);
			}
		}

		// 패널 안 버튼 배치 (그리기·클릭 판정 공용)
		const PANEL = { x: 660, w: 600 };
		function panelLayout() {
			if (settingsView === 'ranking') {
				const y = 260, h = 470;
				return { y, h, buttons: [{ key: 'back', label: '돌아가기', x: PANEL.x + 175, y: y + 360, w: 250, h: 62 }] };
			}
			const y = 150, h = 790;
			const labels = [
				['resume', '게임 재개'],
				['restart', '다시하기'],
				['sound', `효과음: ${settings.sound ? '켜짐' : '꺼짐'}`],
				['motion', `움직임 줄이기: ${settings.reduceMotion ? '켜짐' : '꺼짐'}`],
				['ranking', '랭킹'],
				['exit', '나가기'],
			];
			return { y, h, buttons: labels.map(([key, label], i) => ({ key, label, x: PANEL.x + 110, y: y + 130 + i * 92, w: 380, h: 60 })) };
		}

		function drawButton(b) {
			const active = hoverKey === b.key;
			drawFrame(b.x, b.y, b.w, b.h, { glow: active });
			shadowText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, 24, active ? '#ffffff' : UI.cream);
		}

		function drawSettingsPanel() {
			const { y, h, buttons } = panelLayout();
			ctx.fillStyle = 'rgba(4, 6, 16, 0.62)';
			ctx.fillRect(0, 0, W, H);
			drawFrame(PANEL.x, y, PANEL.w, h, { caps: false, centerGems: true, cornerGems: true, fill: '#0d1424' });
			shadowText(settingsView === 'ranking' ? 'RANKING' : 'MENU', PANEL.x + PANEL.w / 2, y + 62, 40, UI.goldHi);
			rect(PANEL.x + 120, y + 98, PANEL.w - 240, 2, UI.goldDk);

			if (settingsView === 'ranking') {
				const ranking = getRanking();
				for (let i = 0; i < RANKING_SIZE; i += 1) {
					const entry = ranking[i];
					const rowY = y + 130 + i * 70;
					rect(PANEL.x + 60, rowY, PANEL.w - 120, 52, UI.navy2);
					rect(PANEL.x + 60, rowY, 6, 52, i === 0 ? UI.goldHi : UI.violet);
					shadowText(`${String(i + 1).padStart(2, '0')}  ${entry ? entry.name : '---'}`, PANEL.x + 84, rowY + 27, 22, UI.cream, 'left');
					shadowText(entry ? formatClock(entry.ms) : '--:--.---', PANEL.x + PANEL.w - 84, rowY + 27, 22, UI.cream, 'right');
				}
			} else {
				shadowText('↑↓ 선택 · Enter 실행 · ESC 닫기', PANEL.x + PANEL.w / 2, y + h - 40, 18, '#cbbbe6');
			}
			buttons.forEach(drawButton);
		}

		function canvasPoint(event) {
			const bounds = canvas.getBoundingClientRect();
			return {
				x: (event.clientX - bounds.left) * W / bounds.width,
				y: (event.clientY - bounds.top) * H / bounds.height,
			};
		}

		const inside = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

		// Opening the settings panel freezes the game (same `paused` flag the
		// level-up cards use) so nothing moves, spawns, or attacks behind it.
		let started = false;
		let pausedByBlur = false;

		function setSettingsOpen(open, byBlur = false) {
			settingsOpen = open;
			settingsView = 'menu';
			paused = open || !started;
			pausedByBlur = open && byBlur;
			hoverKey = open ? 'resume' : null;
		}

		function startGame() {
			if (started) return;
			started = true;
			paused = false;
			ensureAudio();
			if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
		}

		function runMenuAction(key) {
			if (key === 'back') { settingsView = 'menu'; hoverKey = 'ranking'; }
			else if (key === 'ranking') { settingsView = 'ranking'; hoverKey = 'back'; }
			else if (key === 'restart') restartGame();
			else if (key === 'resume') resumeGame();
			else if (key === 'exit') exitToPortfolio();
			else if (key === 'sound') { ensureAudio(); setSound(!settings.sound); }
			else if (key === 'motion') setReduceMotion(!settings.reduceMotion);
		}

		canvas.addEventListener('mousemove', (event) => {
			const p = canvasPoint(event);
			hoverKey = inside(p, MENU_BTN) ? 'menuBtn' : null;
			if (!started && inside(p, START_BTN)) hoverKey = 'start';
			if (settingsOpen) {
				const hit = panelLayout().buttons.find((b) => inside(p, b));
				if (hit) hoverKey = hit.key;
			}
			canvas.style.cursor = hoverKey ? 'pointer' : 'crosshair';
		});

		canvas.addEventListener('click', (event) => {
			const p = canvasPoint(event);
			if (!started) {
				if (inside(p, START_BTN)) startGame();
				return;
			}
			if (inside(p, MENU_BTN)) {
				if (!cardFrame) setSettingsOpen(!settingsOpen);
				return;
			}
			if (!settingsOpen) return;
			const hit = panelLayout().buttons.find((b) => inside(p, b));
			if (hit) runMenuAction(hit.key);
		});

		function restartGame() {
			window.location.reload();
		}

		function resumeGame() {
			setSettingsOpen(false);
		}

		function exitToPortfolio() {
			window.location.href = '../index.html';
		}

		window.addEventListener('keydown', (event) => {
			if (event.repeat && (event.code === 'Escape' || event.code === 'KeyM' || event.code === 'Enter' || event.code === 'Space')) return; // 누르고 있어도 한 번만
			if (!started) {
				if (event.code === 'Enter' || event.code === 'Space') { event.preventDefault(); startGame(); }
				return;
			}
			if (event.code === 'KeyM') { ensureAudio(); setSound(!settings.sound); return; }
			if (event.code === 'Escape') {
				if (settingsOpen) setSettingsOpen(false);
				else if (!paused) setSettingsOpen(true); // 레벨업 카드 위에는 열지 않음
				return;
			}
			if (settingsOpen && ['ArrowUp', 'ArrowDown', 'Enter', 'Space'].includes(event.code)) {
				event.preventDefault();
				const buttons = panelLayout().buttons;
				let i = buttons.findIndex((b) => b.key === hoverKey);
				if (event.code === 'ArrowDown') hoverKey = buttons[(i + 1 + buttons.length) % buttons.length].key;
				else if (event.code === 'ArrowUp') hoverKey = buttons[(i - 1 + buttons.length) % buttons.length].key;
				else if (i >= 0) runMenuAction(buttons[i].key);
			}
		});

		// 포커스 이탈(다른 창·탭으로 이동): 눌려 있던 키를 모두 놓은 것으로 처리하고 자동 일시정지
		function clearInput() { input.left = input.right = input.up = input.down = false; }
		function onFocusLost() {
			clearInput();
			if (started && !paused && !gameOver && !cleared) setSettingsOpen(true, true);
		}
		window.addEventListener('blur', onFocusLost);
		document.addEventListener('visibilitychange', () => {
			if (document.hidden) onFocusLost();
			else lastTime = performance.now(); // 돌아왔을 때 멈춰 있던 시간이 한꺼번에 흐르지 않게
		});

		// ===== Static background pre-render =====
		// 배경 이미지를 한 번만 1920×1080 캔버스에 그려 두고 매 프레임 그대로 찍음
		const bgCanvas = document.createElement('canvas');
		bgCanvas.width = W;
		bgCanvas.height = H;
		const bgCtx = bgCanvas.getContext('2d');
		bgCtx.imageSmoothingEnabled = false;
		bgCtx.fillStyle = '#13262b';
		bgCtx.fillRect(0, 0, W, H);
		function paintBackground() {
			bgCtx.drawImage(bgImage, 0, 0, W, H);
		}
		if (bgImage.complete && bgImage.naturalWidth) paintBackground();
		else bgImage.addEventListener('load', paintBackground);

		// ===== Character sprite =====
		const FRAME_SRC_SIZE = 128;
		const CHAR_DISPLAY_SIZE = 88; // 220 / 2.5
		const CHAR_SPEED = 152; // px / sec, scaled down with the character (380 / 2.5)

		const ANIMATIONS = {
			idle: { src: 'assets/idle_loop_strip.png', frames: 4, frameDuration: 180 },
			walkLeft: { src: 'assets/walk_left_strip.png', frames: 3, frameDuration: 110 },
			walkRight: { src: 'assets/walk_right_strip.png', frames: 3, frameDuration: 110 },
		};

		const sheets = {};
		Object.entries(ANIMATIONS).forEach(([name, anim]) => {
			const img = new Image();
			img.src = anim.src;
			sheets[name] = img;
		});

		// Movement is WASD only - arrow keys are intentionally not bound here.
		const input = { left: false, right: false, up: false, down: false };

		window.addEventListener('keydown', (e) => {
			if (e.code === 'KeyA') { input.left = true; e.preventDefault(); }
			if (e.code === 'KeyD') { input.right = true; e.preventDefault(); }
			if (e.code === 'KeyW') { input.up = true; e.preventDefault(); }
			if (e.code === 'KeyS') { input.down = true; e.preventDefault(); }
		});

		window.addEventListener('keyup', (e) => {
			if (e.code === 'KeyA') input.left = false;
			if (e.code === 'KeyD') input.right = false;
			if (e.code === 'KeyW') input.up = false;
			if (e.code === 'KeyS') input.down = false;
		});

		const player = {
			x: W / 2,
			y: H / 2 + 90,
			facing: 'right', // last horizontal direction, used while walking straight up/down
			animName: 'idle',
			frameIndex: 0,
			frameElapsed: 0,
		};

		// ===== Level / XP =====
		// Level 1-100. XP needed to clear a level starts at 3 (level 1->2) and
		// goes up by 1 every level (level 2->3 needs 4, ... level 99->100 needs 101).
		const MAX_LEVEL = 100;
		let playerLevel = 1;
		let xpIntoLevel = 0; // progress toward the next level (resets on level-up)
		let totalXP = 0; // lifetime total, never resets - shown as the "총량"

		function xpToClearLevel(level) {
			return 3 + (level - 1);
		}

		function gainXP(amount) {
			totalXP += amount;
			if (playerLevel >= MAX_LEVEL) return;
			xpIntoLevel += amount;
			while (playerLevel < MAX_LEVEL && xpIntoLevel >= xpToClearLevel(playerLevel)) {
				xpIntoLevel -= xpToClearLevel(playerLevel);
				playerLevel += 1;
			}
			if (playerLevel >= MAX_LEVEL) {
				playerLevel = MAX_LEVEL;
				xpIntoLevel = 0;
			}
			maybeShowLevelCard();
		}

		// ===== Level-up cards (every 5 levels) =====
		// atk_speed: -15% attack interval (stacks multiplicatively).
		// extra_shot: +1 projectile per attack (stacks additively, capped at 6 picks).
		// move_speed: +10% move speed (stacks multiplicatively).
		// full_heal: instant one-time full heal, no persistent effect.
		// damage_up: spell damage x1.05 (stacks multiplicatively).
		// pierce ("rare"/gold): +1 enemy a projectile can punch through (stacks
		//   additively). Only offered on levels that are multiples of 10.
		// wave / spray ("epic"/diamond, same tier): one-time unlocks (repeat
		//   picks do nothing, so each is dropped from the pool once taken) -
		//   grants a flat 5% chance, rolled independently every 1 second
		//   (not tied to attacks). On success, wave fires a huge burst in
		//   every direction, spray fires 10-15 projectiles toward the current
		//   attack direction spread across a 45 degree cone. Offered on every
		//   5-level milestone (same cadence as the other cards).
		// Being in the pool doesn't guarantee a card shows - card.html still
		// only rolls 3 out of whatever's offered.
		const EXTRA_SHOT_MAX_PICKS = 6;
		let lastCardLevel = 0;
		let paused = true; // 시작 안내 화면에서 시작하기를 누를 때까지 멈춤
		let cardFrame = null;
		let attackIntervalMultiplier = 1;
		let moveSpeedMultiplier = 1;
		let damageMultiplier = 1;
		let extraProjectileCount = 0;
		let pierceCount = 0;
		let waveChance = 0;
		let sprayChance = 0;

		// A single XP gain can cross several 5-level milestones at once (the
		// curve is short now, so this happens often). Rather than checking
		// "is playerLevel a multiple of 5" - which silently skips any
		// milestone jumped clean over - we track the next unclaimed milestone
		// after lastCardLevel and show one card at a time, re-checking after
		// each pick so nothing gets skipped even on a multi-level jump.
		function maybeShowLevelCard() {
			const nextMilestone = lastCardLevel + (5 - (lastCardLevel % 5));
			if (playerLevel >= nextMilestone) {
				lastCardLevel = nextMilestone;
				showLevelCard(nextMilestone);
			}
		}

		function showLevelCard(milestoneLevel) {
			paused = true;
			cardFrame = document.createElement('iframe');
			const offerRareTier = milestoneLevel % 10 === 0; // pierce stays 10-level-only
			const params = new URLSearchParams();
			if (offerRareTier) params.set('pierce', '1');
			params.set('wave', '1'); // wave/spray now offered every 5-level milestone
			params.set('spray', '1');
			params.set('extraShotCount', String(extraProjectileCount));
			if (extraProjectileCount >= EXTRA_SHOT_MAX_PICKS) params.set('extraShotMaxed', '1');
			if (waveChance > 0) params.set('waveMaxed', '1');
			if (sprayChance > 0) params.set('sprayMaxed', '1');
			const query = params.toString();
			cardFrame.src = 'card.html' + (query ? '?' + query : '');
			cardFrame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1000;';
			document.body.appendChild(cardFrame);
		}

		function applyCardUpgrade(key) {
			if (key === 'atk_speed') attackIntervalMultiplier *= 0.85;
			else if (key === 'extra_shot') extraProjectileCount = Math.min(EXTRA_SHOT_MAX_PICKS, extraProjectileCount + 1);
			else if (key === 'move_speed') moveSpeedMultiplier *= 1.1;
			else if (key === 'full_heal') health.current = health.max;
			else if (key === 'damage_up') damageMultiplier *= 1.05;
			else if (key === 'pierce') pierceCount += 1;
			else if (key === 'wave') waveChance = 0.05;
			else if (key === 'spray') sprayChance = 0.05;
		}

		window.addEventListener('message', (event) => {
			const data = event.data;
			if (!data || data.source !== 'level-card') return;
			applyCardUpgrade(data.key);
			if (cardFrame) {
				cardFrame.remove();
				cardFrame = null;
			}
			paused = settingsOpen || !started;
			window.focus(); // 카드 창이 사라진 뒤 키보드 입력이 다시 게임으로 오도록
			maybeShowLevelCard(); // in case this XP gain jumped past more than one milestone
		});

		function setAnimation(name) {
			if (player.animName === name) return;
			player.animName = name;
			player.frameIndex = 0;
			player.frameElapsed = 0;
		}

		function updateState() {
			if (input.left && !input.right) {
				player.facing = 'left';
				setAnimation('walkLeft');
			} else if (input.right && !input.left) {
				player.facing = 'right';
				setAnimation('walkRight');
			} else if (input.up || input.down) {
				// No dedicated up/down sprite: keep walking on the last horizontal facing.
				setAnimation(player.facing === 'left' ? 'walkLeft' : 'walkRight');
			} else {
				setAnimation('idle');
			}
		}

		function updateMovement(dt) {
			const half = CHAR_DISPLAY_SIZE / 2;
			const dist = (CHAR_SPEED * moveSpeedMultiplier * dt) / 1000;

			let dx = 0;
			let dy = 0;
			if (input.left && !input.right) dx -= 1;
			if (input.right && !input.left) dx += 1;
			if (input.up && !input.down) dy -= 1;
			if (input.down && !input.up) dy += 1;

			if (dx !== 0 && dy !== 0) {
				const norm = Math.SQRT1_2; // keep diagonal speed equal to axis-aligned speed
				dx *= norm;
				dy *= norm;
			}

			player.x = Math.min(W - half, Math.max(half, player.x + dx * dist));
			player.y = Math.min(H - half, Math.max(half, player.y + dy * dist));
		}

		function updateAnimation(dt) {
			const anim = ANIMATIONS[player.animName];
			player.frameElapsed += dt;
			while (player.frameElapsed >= anim.frameDuration) {
				player.frameElapsed -= anim.frameDuration;
				player.frameIndex = (player.frameIndex + 1) % anim.frames;
			}
		}

		// idle_loop_strip.png frame 1 (the resting pose) is drawn ~11% taller/wider
		// than frames 2-4 (the breathing motion), which makes the loop visibly
		// "pop" in size every cycle. Frames 2-4 already match each other closely,
		// so only frame 1 needs correcting back down to their scale.
		const IDLE_FRAME_SCALE = [0.89, 1, 1, 1];

		function drawPlayer() {
			const sheet = sheets[player.animName];
			if (!sheet.complete || sheet.naturalWidth === 0) return;
			const sx = player.frameIndex * FRAME_SRC_SIZE;
			const scale = player.animName === 'idle' ? IDLE_FRAME_SCALE[player.frameIndex] : 1;
			const size = CHAR_DISPLAY_SIZE * scale;
			const bottom = player.y + CHAR_DISPLAY_SIZE / 2; // keep feet planted while size is corrected

			// Flicker while invulnerable so the 0.5s hit-immunity window is visible.
			const flickering = playerInvulnMs > 0 && Math.floor(playerInvulnMs / 80) % 2 === 0;
			ctx.globalAlpha = flickering ? 0.35 : 1;
			ctx.drawImage(
				sheet,
				sx, 0, FRAME_SRC_SIZE, FRAME_SRC_SIZE,
				player.x - size / 2, bottom - size,
				size, size
			);
			ctx.globalAlpha = 1;
		}

		// ===== Slimes =====
		// Green (normal) slimes appear from the start. Poison joins in at 1:30,
		// ice joins in at 3:00 (earlier types keep spawning too - it stacks).
		// The live-slime cap starts at 20 and grows by 7 every 20 seconds; the
		// actual number on screen at any moment is randomized up to that cap.
		// ===== 난이도 설정 (T02 카드 3: 한 번에 값 하나만 바꿔서 10판씩 비교) =====
		// 플레이 기록에 이 값들이 함께 남으므로, 바꾼 값이 기록표에서 바로 보임.
		const DIFFICULTY = {
			slimeSpeed: 70,      // 슬라임 이동 속도(px/초). 플레이어는 152
			slimeDamage: 8,      // 부딪힐 때 깎이는 체력
			spawnBase: 6,        // 7.5초 구간마다 새로 나올 수 있는 슬라임 수의 시작값
			spawnStep: 3,        // 구간이 바뀔 때마다 늘어나는 수
			bossStat: 2,         // 보스 체력·경험치 배율
			finalRush: 1.6,      // 마지막 보스 등장 후 남은 슬라임 돌진 속도 배율
		};

		const SLIME_FRAME_SIZE = 128;
		const SLIME_DISPLAY_SIZE = 64;
		const SLIME_SPEED = DIFFICULTY.slimeSpeed; // px / sec, chases the player - slower than the player's 152

		const SLIME_BOUNCE = [
			{ duration: 520, y: 0 },
			{ duration: 90, y: 3 },
			{ duration: 160, y: -16 },
			{ duration: 110, y: 2 },
		];

		// normal appears from the start, poison joins at 1:30, ice joins at 3:00 -
		// once unlocked a type keeps spawning alongside the others (mixed pool).
		const SLIME_TYPES = {
			normal: { src: 'assets/slime_normal_strip.png', unlockMs: 0, hp: 10, xp: 3 }, // 한 방
			poison: { src: 'assets/slime_poison_strip.png', unlockMs: 7 * 1000, hp: 20, xp: 6 }, // 두 방
			ice: { src: 'assets/slime_ice_strip.png', unlockMs: 999 * 60 * 1000, hp: 80, xp: 9 }, // 30초 판에서는 등장 안 함
		};

		const slimeSheets = {};
		Object.entries(SLIME_TYPES).forEach(([key, type]) => {
			const img = new Image();
			img.src = type.src;
			slimeSheets[key] = img;
		});

		let elapsedMs = 0;
		let slimes = [];
		let nextSpawnCheck = 0;
		let nextSlimeId = 1;

		function unlockedSlimeTypes() {
			return Object.keys(SLIME_TYPES).filter((key) => elapsedMs >= SLIME_TYPES[key].unlockMs);
		}

		const SPAWN_TIER_MS = 7500;

		function currentSlimeCap() {
			return DIFFICULTY.spawnBase + DIFFICULTY.spawnStep * Math.floor(elapsedMs / SPAWN_TIER_MS);
		}

		// Every time the cap steps up (every 20s) all slime HP - regular and
		// boss alike - goes up another 15% from its base value.
		function hpTierMultiplier() {
			return 1 + 0.05 * Math.floor(elapsedMs / SPAWN_TIER_MS); // 30초 판이라 체력 증가폭을 작게
		}

		// Boss slimes reuse a regular slime's art/type but 3x the display size -
		// hitbox and HP/XP scale along with it (10x stats before the tier bonus
		// above), which puts a normal-boss at 200 HP, poison-boss at 400 HP,
		// ice-boss at 800 HP at the very start of the game.
		const BOSS_SIZE_MULTIPLIER = 3;
		const BOSS_STAT_MULTIPLIER = DIFFICULTY.bossStat;

		function spawnSlime(isBoss = false, forcedType = null) {
			const types = unlockedSlimeTypes();
			const type = forcedType || types[Math.floor(Math.random() * types.length)];
			// Spawn just outside a random edge so it visibly walks onto the field.
			const margin = isBoss ? SLIME_DISPLAY_SIZE * BOSS_SIZE_MULTIPLIER : 50;
			const edge = Math.floor(Math.random() * 4);
			let x;
			let y;
			if (edge === 0) { x = Math.random() * W; y = -margin; }
			else if (edge === 1) { x = W + margin; y = Math.random() * H; }
			else if (edge === 2) { x = Math.random() * W; y = H + margin; }
			else { x = -margin; y = Math.random() * H; }

			const base = SLIME_TYPES[type];
			const size = isBoss ? SLIME_DISPLAY_SIZE * BOSS_SIZE_MULTIPLIER : SLIME_DISPLAY_SIZE;
			const statMult = (isBoss ? BOSS_STAT_MULTIPLIER : 1) * hpTierMultiplier();
			const hp = Math.round(base.hp * statMult);
			const xp = isBoss ? base.xp * BOSS_STAT_MULTIPLIER : base.xp;

			slimes.push({ id: nextSlimeId++, type, x, y, facing: 1, frameIndex: 0, frameElapsed: 0, hp, xp, size, isBoss });
		}

		// Every 20s the tier changes and gets an entirely fresh spawn budget
		// equal to that tier's full cap value (20, 27, 34, 41...) - not the
		// +7 delta, and not reduced by how many are alive or were spawned in
		// a previous tier. E.g. tier goes 20 -> 27 -> 34: the moment the cap
		// becomes 27, up to 27 new slimes spawn (trickled in randomly) on top
		// of whatever's already on the field, with zero regard for that;
		// the next tier then independently spawns up to 34 more the same way.
		let spawnTier = -1;
		let tierSpawnedCount = 0;

		function updateSlimeSpawning(dt) {
			if (finalWaveSpawned) return; // 마지막 보스가 나오면 새 슬라임 없음 → 필드를 비우면 클리어
			nextSpawnCheck -= dt;
			if (nextSpawnCheck > 0) return;
			nextSpawnCheck = 800 + Math.random() * 1200; // re-roll the target every ~0.8-2s

			const tier = Math.floor(elapsedMs / SPAWN_TIER_MS);
			if (tier !== spawnTier) {
				spawnTier = tier;
				tierSpawnedCount = 0; // brand new budget for this tier, no carry-over
			}

			const budget = currentSlimeCap();
			if (tierSpawnedCount >= budget) return;
			const target = Math.floor(Math.random() * (budget + 1));
			const toSpawn = Math.max(0, target - tierSpawnedCount);
			for (let i = 0; i < toSpawn; i += 1) {
				spawnSlime();
				tierSpawnedCount += 1;
			}
		}

		// Fixed boss schedule instead of a repeating timer: 1:00 normal boss,
		// 2:00 poison boss, 3:00 ice boss, 4:00 two random bosses, 5:00 three
		// random bosses (the final wave - clearing the field after this wins).
		// 30초 판: 0:07 초록 보스 → 0:15 마지막 보스(독) 등장과 함께 새 슬라임 중단.
		// 남은 적을 모두 처치하면 클리어(보통 30초 안팎), 체력이 0이 되면 실패.
		const FINAL_WAVE_MS = 15 * 1000;
		const BOSS_SCHEDULE = [
			{ atMs: 7 * 1000, forcedType: 'normal', count: 1 },
			{ atMs: FINAL_WAVE_MS, forcedType: 'poison', count: 1 },
		];
		let bossScheduleIndex = 0;
		let finalWaveSpawned = false;

		function updateBossSchedule() {
			while (bossScheduleIndex < BOSS_SCHEDULE.length && elapsedMs >= BOSS_SCHEDULE[bossScheduleIndex].atMs) {
				const wave = BOSS_SCHEDULE[bossScheduleIndex];
				for (let i = 0; i < wave.count; i += 1) spawnSlime(true, wave.forcedType);
				if (wave.atMs === FINAL_WAVE_MS) finalWaveSpawned = true;
				bossScheduleIndex += 1;
			}
		}

		// ===== Ranking (top 3 clear times only) =====
		// Stored as [{ name, ms }], ascending by ms (fastest clear first).
		// Anything that doesn't make the top 3 after a sort+slice is simply
		// dropped - never written back to storage.
		const RANKING_KEY = 'pixelMeadowRanking';
		const RANKING_SIZE = 3;

		// 손상된 기록은 버리고, 이름(문자열)과 시간(0 이상 숫자)이 맞는 항목만 사용
		function cleanRanking(raw) {
			if (!Array.isArray(raw)) return [];
			return raw
				.filter((e) => e && typeof e.name === 'string' && Number.isFinite(e.ms) && e.ms >= 0)
				.map((e) => ({ name: e.name.slice(0, 10), ms: Math.floor(e.ms) }))
				.sort((a, b) => a.ms - b.ms)
				.slice(0, RANKING_SIZE);
		}

		function getRanking() {
			return cleanRanking(store.json(RANKING_KEY, []));
		}

		function recordRanking(name, ms) {
			const list = getRanking();
			list.push({ name, ms });
			store.set(RANKING_KEY, JSON.stringify(cleanRanking(list)));
		}

		// ===== 플레이 기록 (T02 카드 3: 판마다 자동 저장, records.html에서 표로 확인) =====
		const RUN_LOG_KEY = 'lumoriaRunLog';
		let kills = 0;
		let lastHitBy = '-';
		function logRun(result) {
			const log = store.json(RUN_LOG_KEY, []);
			const list = Array.isArray(log) ? log.filter((r) => r && typeof r === 'object') : [];
			list.push({
				at: new Date().toISOString(),
				result,                                   // 'clear' | 'fail'
				ms: Math.floor(elapsedMs),
				level: playerLevel,
				kills,
				hp: health.current,
				cause: result === 'clear' ? '클리어' : `체력 0 (마지막 피격: ${lastHitBy})`,
				difficulty: { ...DIFFICULTY },
			});
			store.set(RUN_LOG_KEY, JSON.stringify(list.slice(-100)));
		}

		let cleared = false;

		function triggerClear() {
			if (cleared) return;
			cleared = true;
			const finalMs = Math.floor(elapsedMs);
			recordRanking(playerName, finalMs);
			logRun('clear');
			playEffect('clear');
			session.set('lastSurvivalMs', String(finalMs));
			window.location.href = 'clear_screen.html';
		}

		function checkClearCondition() {
			if (finalWaveSpawned && slimes.length === 0) triggerClear();
		}

		function updateSlimes(dt) {
			slimes.forEach((s) => {
				const dx = player.x - s.x;
				const dy = player.y - s.y;
				const dist = Math.hypot(dx, dy) || 1;
				const step = (SLIME_SPEED * (finalWaveSpawned ? DIFFICULTY.finalRush : 1) * dt) / 1000;
				s.x += (dx / dist) * step;
				s.y += (dy / dist) * step;
				if (Math.abs(dx) > 2) s.facing = dx < 0 ? -1 : 1;

				s.frameElapsed += dt;
				while (s.frameElapsed >= SLIME_BOUNCE[s.frameIndex].duration) {
					s.frameElapsed -= SLIME_BOUNCE[s.frameIndex].duration;
					s.frameIndex = (s.frameIndex + 1) % SLIME_BOUNCE.length;
				}
			});
		}

		// ===== Slime collision =====
		const SLIME_DAMAGE = DIFFICULTY.slimeDamage;
		const HIT_INVULN_MS = 500;
		let playerInvulnMs = 0;

		function updateCollisions(dt) {
			if (playerInvulnMs > 0) {
				playerInvulnMs = Math.max(0, playerInvulnMs - dt);
				return; // still immune from the last hit - can't take damage again yet
			}

			for (const s of slimes) {
				const hitRadius = CHAR_DISPLAY_SIZE * 0.35 + s.size * 0.35;
				const dx = player.x - s.x;
				const dy = player.y - (s.y - s.size / 2); // compare center-to-center
				if (Math.hypot(dx, dy) <= hitRadius) {
					health.current = Math.max(0, health.current - SLIME_DAMAGE);
					lastHitBy = `${s.isBoss ? '보스 ' : ''}${{ normal: '초록', poison: '독', ice: '얼음' }[s.type]} 슬라임`;
					playEffect('hit');
					playerInvulnMs = HIT_INVULN_MS;
					if (health.current <= 0) triggerGameOver();
					break; // one hit per invulnerability window, even if several slimes are touching
				}
			}
		}

		let gameOver = false;

		function triggerGameOver() {
			if (gameOver) return;
			gameOver = true;
			logRun('fail');
			session.set('lastSurvivalMs', String(Math.floor(elapsedMs)));
			window.location.href = 'gameover_screen.html';
		}

		function drawSlimes() {
			slimes.forEach((s) => {
				const sheet = slimeSheets[s.type];
				if (!sheet.complete || sheet.naturalWidth === 0) return;
				const frame = SLIME_BOUNCE[s.frameIndex];
				const sx = s.frameIndex * SLIME_FRAME_SIZE;
				const size = s.size;
				const bottom = s.y + frame.y;

				if (s.isBoss) {
					// Menacing red glow behind the boss so it reads as dangerous
					// from a distance, plus a floating "BOSS" tag above it.
					const glowRadius = size * 0.6;
					const grad = ctx.createRadialGradient(s.x, bottom - size / 2, size * 0.1, s.x, bottom - size / 2, glowRadius);
					grad.addColorStop(0, 'rgba(220, 60, 60, 0.45)');
					grad.addColorStop(1, 'rgba(220, 60, 60, 0)');
					ctx.fillStyle = grad;
					ctx.fillRect(s.x - glowRadius, bottom - size - glowRadius / 2, glowRadius * 2, glowRadius * 2 + size);

					ctx.fillStyle = '#ffd76a';
					ctx.font = 'bold 18px Courier New, monospace';
					ctx.textAlign = 'center';
					ctx.textBaseline = 'middle';
					ctx.fillText('BOSS', s.x, bottom - size - 14);
				}

				ctx.save();
				ctx.translate(s.x, 0);
				if (s.facing < 0) ctx.scale(-1, 1);
				ctx.drawImage(
					sheet,
					sx, 0, SLIME_FRAME_SIZE, SLIME_FRAME_SIZE,
					-size / 2, bottom - size,
					size, size
				);
				ctx.restore();
			});
		}

		function killSlime(index) {
			const s = slimes[index];
			kills += 1;
			gainXP(s.xp);
			slimes.splice(index, 1);
		}

		// ===== Spells (auto-attack) =====
		// Level < 30: dark orb (one-shots normal, 2 hits to kill poison).
		// Level 30-49: demon flame (one-shots poison, 2 hits to kill ice).
		// Level 50+: void shard (one-shots ice).
		const SPELL_FRAME_SIZE = 128;
		const SPELL_DISPLAY_SIZE = 60; // 40 * 1.5
		const PROJECTILE_SPEED = 460; // px / sec
		const PROJECTILE_MAX_LIFE_MS = 1500;
		const ATTACK_INTERVAL_MS = 700;

		const SPELLS = {
			dark_orb: { src: 'assets/dark_orb_strip.png', damage: 10, minLevel: 1 },
			demon_flame: { src: 'assets/demon_flame_strip.png', damage: 20, minLevel: 30 },
			void_shard: { src: 'assets/void_shard_strip.png', damage: 40, minLevel: 50 },
		};

		const spellSheets = {};
		Object.entries(SPELLS).forEach(([key, spell]) => {
			const img = new Image();
			img.src = spell.src;
			spellSheets[key] = img;
		});

		function currentSpellKey() {
			if (playerLevel >= 50) return 'void_shard';
			if (playerLevel >= 30) return 'demon_flame';
			return 'dark_orb';
		}

		let attackCooldownMs = 0;
		let projectiles = [];

		function findNearestSlime() {
			let nearest = null;
			let nearestDist = Infinity;
			slimes.forEach((s) => {
				const d = Math.hypot(player.x - s.x, player.y - (s.y - s.size / 2));
				if (d < nearestDist) {
					nearestDist = d;
					nearest = s;
				}
			});
			return nearest;
		}

		function spawnProjectile(spellKey, spell, angle, isSpecial = false, speed = PROJECTILE_SPEED) {
			projectiles.push({
				spellKey,
				isSpecial,
				damage: Math.round(spell.damage * damageMultiplier),
				x: player.x,
				y: player.y,
				vx: Math.cos(angle) * speed,
				vy: Math.sin(angle) * speed,
				life: PROJECTILE_MAX_LIFE_MS,
				pierceLeft: pierceCount, // extra hits beyond the first before it's spent
				hitIds: [],
			});
		}

		function fireSpell() {
			const target = findNearestSlime();
			if (!target) return;

			const spellKey = currentSpellKey();
			const spell = SPELLS[spellKey];
			const baseAngle = Math.atan2(
				(target.y - target.size / 2) - player.y,
				target.x - player.x
			);

			// Extra projectiles fan out in a small spread around the aim angle
			// instead of stacking exactly on top of each other.
			const shotCount = 1 + extraProjectileCount;
			const spreadStep = 0.18; // radians between adjacent shots
			const startOffset = -((shotCount - 1) / 2) * spreadStep;

			for (let i = 0; i < shotCount; i += 1) {
				spawnProjectile(spellKey, spell, baseAngle + startOffset + i * spreadStep);
			}
		}

		function updateAttacks(dt) {
			attackCooldownMs -= dt;
			if (attackCooldownMs <= 0 && slimes.length > 0) {
				fireSpell();
				attackCooldownMs = ATTACK_INTERVAL_MS * attackIntervalMultiplier;
			}
		}

		// ===== Epic-tier passives (wave / spray) =====
		// Both run on their own timer, completely independent of the normal
		// attack cooldown above - a fresh check every 1 second.
		const PASSIVE_CHECK_MS = 1000;
		const WAVE_PROJECTILE_COUNT = 6;
		const WAVE_LAYER_COUNT = 2; // 6 x 2 = 12 total (half of the old 24), second ring still staggered
		const SPRAY_MIN_COUNT = 10;
		const SPRAY_MAX_COUNT = 15;
		const SPRAY_CONE_RAD = Math.PI / 4; // 45 degrees total spread

		let passiveCheckMs = 0;

		function fireWaveBurst() {
			const spellKey = currentSpellKey();
			const spell = SPELLS[spellKey];
			for (let layer = 0; layer < WAVE_LAYER_COUNT; layer += 1) {
				const layerOffset = layer * (Math.PI / WAVE_PROJECTILE_COUNT);
				for (let i = 0; i < WAVE_PROJECTILE_COUNT; i += 1) {
					const angle = layerOffset + (Math.PI * 2 * i) / WAVE_PROJECTILE_COUNT;
					spawnProjectile(spellKey, spell, angle, true);
				}
			}
		}

		function fireSpray() {
			const target = findNearestSlime();
			if (!target) return;
			const spellKey = currentSpellKey();
			const spell = SPELLS[spellKey];
			const baseAngle = Math.atan2(
				(target.y - target.size / 2) - player.y,
				target.x - player.x
			);
			const count = SPRAY_MIN_COUNT + Math.floor(Math.random() * (SPRAY_MAX_COUNT - SPRAY_MIN_COUNT + 1));
			for (let i = 0; i < count; i += 1) {
				const angle = baseAngle + (Math.random() - 0.5) * SPRAY_CONE_RAD;
				// Randomized speed (70%-130%) so the bolts drift apart over
				// time instead of moving as one uniform front - reads more
				// like several separate casts going out at once.
				const speed = PROJECTILE_SPEED * (0.7 + Math.random() * 0.6);
				spawnProjectile(spellKey, spell, angle, true, speed); // orange recolor, same as 마법 파동
			}
		}

		function updatePassives(dt) {
			if (slimes.length === 0) return;
			passiveCheckMs += dt;
			while (passiveCheckMs >= PASSIVE_CHECK_MS) {
				passiveCheckMs -= PASSIVE_CHECK_MS;
				if (waveChance > 0 && Math.random() < waveChance) fireWaveBurst();
				if (sprayChance > 0 && Math.random() < sprayChance) fireSpray();
			}
		}

		function updateProjectiles(dt) {
			for (let i = projectiles.length - 1; i >= 0; i -= 1) {
				const p = projectiles[i];
				p.x += (p.vx * dt) / 1000;
				p.y += (p.vy * dt) / 1000;
				p.life -= dt;

				if (p.life <= 0 || p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) {
					projectiles.splice(i, 1);
					continue;
				}

				for (let j = slimes.length - 1; j >= 0; j -= 1) {
					const s = slimes[j];
					if (p.hitIds.includes(s.id)) continue; // already pierced through this one
					const hitRadius = SPELL_DISPLAY_SIZE * 0.35 + s.size * 0.35;
					const dist = Math.hypot(p.x - s.x, p.y - (s.y - s.size / 2));
					if (dist <= hitRadius) {
						s.hp -= p.damage;
						p.hitIds.push(s.id);
						if (s.hp <= 0) killSlime(j);

						if (p.pierceLeft > 0) {
							p.pierceLeft -= 1; // keep flying, can hit another enemy
						} else {
							projectiles.splice(i, 1);
						}
						break;
					}
				}
			}
		}

		// 마법 파동 / 마법 난사 bolts get an orange recolor. ctx.filter is very
		// expensive to run per-projectile per-frame (that was the source of
		// the lag when a wave/spray burst was on screen), so instead we
		// hue-rotate each spell's flying-orb frame ONCE into an offscreen
		// canvas and just blit that cached bitmap afterwards - no per-frame
		// filter cost no matter how many orange bolts are alive at once.
		const orangeTintCache = {};

		function getOrangeTintedSprite(spellKey) {
			if (orangeTintCache[spellKey]) return orangeTintCache[spellKey];
			const sheet = spellSheets[spellKey];
			if (!sheet.complete || sheet.naturalWidth === 0) return null;

			const off = document.createElement('canvas');
			off.width = SPELL_FRAME_SIZE;
			off.height = SPELL_FRAME_SIZE;
			const offCtx = off.getContext('2d');
			offCtx.filter = 'hue-rotate(110deg) saturate(1.4) brightness(1.1)';
			offCtx.drawImage(
				sheet,
				2 * SPELL_FRAME_SIZE, 0, SPELL_FRAME_SIZE, SPELL_FRAME_SIZE,
				0, 0, SPELL_FRAME_SIZE, SPELL_FRAME_SIZE
			);
			orangeTintCache[spellKey] = off;
			return off;
		}

		function drawProjectiles() {
			projectiles.forEach((p) => {
				const size = SPELL_DISPLAY_SIZE;
				let source;
				let sx = 2 * SPELL_FRAME_SIZE; // frame 2 (fully "charged") is the flying orb look
				let sy = 0;

				if (p.isSpecial) {
					source = getOrangeTintedSprite(p.spellKey);
					if (!source) return;
					sx = 0; // the cached canvas holds just that one frame
				} else {
					source = spellSheets[p.spellKey];
					if (!source.complete || source.naturalWidth === 0) return;
				}

				ctx.save();
				ctx.shadowColor = p.isSpecial ? 'rgba(255, 150, 40, 0.9)' : 'rgba(190, 140, 255, 0.9)';
				ctx.shadowBlur = 14;
				ctx.drawImage(
					source,
					sx, sy, SPELL_FRAME_SIZE, SPELL_FRAME_SIZE,
					p.x - size / 2, p.y - size / 2,
					size, size
				);
				ctx.restore();
			});
		}

		// ===== 배경 연출: 떠다니는 보라 입자 (배경 그림 위에 아주 은은하게) =====
		const motes = Array.from({ length: 36 }, (_, i) => {
			const r = seeded(100 + i);
			return { x: r() * W, y: r() * H, v: 6 + r() * 14, ph: r() * 6.28, s: r() < 0.3 ? 6 : 4, c: ['#b57bff', '#d6b4ff', '#8f5cf0'][i % 3] };
		});

		let ambientT = 0;
		function drawAmbient(dt) {
			if (!reduceMotion) ambientT += dt;
			const t = ambientT / 1000;
			ctx.save();
			ctx.imageSmoothingEnabled = false;
			motes.forEach((m) => {
				const y = reduceMotion ? m.y : (m.y - t * m.v + H * 4) % H;
				const x = m.x + (reduceMotion ? 0 : Math.sin(t * 0.6 + m.ph) * 10);
				ctx.globalAlpha = 0.35 + 0.35 * (reduceMotion ? 1 : (Math.sin(t * 1.3 + m.ph) + 1) / 2);
				ctx.fillStyle = m.c;
				ctx.fillRect(Math.round(x), Math.round(y), m.s, m.s);
			});
			ctx.restore();
		}

		// 어두운 바닥에서도 마법사가 잘 보이도록 발밑에 계단식 보라빛
		function drawPlayerLight() {
			const cx = player.x, cy = player.y + CHAR_DISPLAY_SIZE / 2 - 6;
			[[64, 18, 0.10], [48, 13, 0.14], [30, 8, 0.20]].forEach(([rx, ry, a]) => {
				ctx.fillStyle = `rgba(143, 92, 240, ${a})`;
				for (let y = -ry; y <= ry; y += 4) {
					const half = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y / ry) ** 2)) / 4) * 4;
					ctx.fillRect(cx - half, cy + y, half * 2, 4);
				}
			});
		}

		let lastDrawDt = 16;
		function draw() {
			const dt = paused ? 0 : lastDrawDt;
			shakeMs = Math.max(0, shakeMs - dt);
			flashMs = Math.max(0, flashMs - dt);
			ctx.save();
			if (shakeMs > 0 && !reduceMotion) {
				const k = shakeMs / 220 * 8;
				ctx.translate(Math.round((Math.random() - 0.5) * k), Math.round((Math.random() - 0.5) * k));
			}
			ctx.drawImage(bgCanvas, 0, 0);
			drawAmbient(dt);
			drawSlimes();
			drawProjectiles();
			drawPlayerLight();
			drawPlayer();
			ctx.restore();
			if (flashMs > 0) {
				ctx.fillStyle = `rgba(220, 40, 60, ${(reduceMotion ? 0.10 : 0.22) * flashMs / 180})`;
				ctx.fillRect(0, 0, W, H);
			}
			drawHud();
		}

		let lastTime = performance.now();

		function tick(now) {
			if (gameOver || cleared) return; // stop the loop once we're on our way to the end screen

			const dt = Math.min(50, now - lastTime); // guard against huge jumps (e.g. tab switch)
			lastTime = now;

			// While paused (settings panel or a level-up card is showing), keep
			// rendering every frame - just skip the simulation - so the overlay
			// itself still draws and stays responsive to clicks.
			if (!paused) {
				elapsedMs += dt;
				updateState();
				updateMovement(dt);
				updateAnimation(dt);
				updateSlimeSpawning(dt);
				updateBossSchedule();
				updateSlimes(dt);
				updateCollisions(dt);
				updateAttacks(dt);
				updatePassives(dt);
				updateProjectiles(dt);
				checkClearCondition();
			}
			lastDrawDt = dt;
			draw();

			requestAnimationFrame(tick);
		}

		requestAnimationFrame(tick);
	</script>
</body>
</html>

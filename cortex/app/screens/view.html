<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORTEX 심의 보기</title>
<meta name="description" content="분석가·세 평가자·의장 AI가 한 편의 자기소개서를 두고 나눈 심의를 대화로 보여줍니다.">
<style>
/*__CSS__*/
.pick { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.pick select {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; max-width: 100%;
}
.pick .fine { margin-left: 2px; }

/* 대화 */
.chat { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; animation: rise .28s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.msg .body { min-width: 0; max-width: min(600px, 100%); }
.msg .who { font-size: 13px; font-weight: 700; margin: 0 0 4px 4px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.msg .who .lens { font-weight: 500; color: var(--ink-3); }
.bubble {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px 20px 20px 20px;
  padding: 12px 16px; box-shadow: var(--shadow);
}
.bubble + .bubble { margin-top: 6px; border-radius: 20px; }
.bubble p { margin: 0; }
.bubble p + p, .bubble p + ul, .bubble ul + p { margin-top: 8px; }
.bubble h4 { font-size: 13px; margin: 0 0 6px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.bubble h4.good { color: var(--good); } .bubble h4.warn { color: var(--warn); }
.bubble section + section { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
.bubble ul { margin: 0; padding-left: 18px; }
.bubble li + li { margin-top: 6px; }
.bubble .why { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }

.msg.me { flex-direction: row-reverse; }
.msg.me .bubble { background: var(--me); color: var(--on-me); border-color: var(--me); border-radius: 20px 6px 20px 20px; }
.msg.me .who { justify-content: flex-end; margin-right: 4px; }
.essay { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.essay.open { display: block; }
.me .more { background: none; border: 0; padding: 0; margin-top: 6px; font-size: 13px; font-weight: 700; color: inherit; opacity: .75; text-decoration: underline; }

.msg.chair .bubble { border-color: var(--ink); }
.note { align-self: center; text-align: center; font-size: 13px; color: var(--ink-3); background: var(--panel-2); border-radius: 999px; padding: 5px 14px; max-width: 92%; animation: rise .28s ease-out both; }

.big { font-size: clamp(19px, 3.4vw, 23px); font-weight: 800; line-height: 1.45; letter-spacing: -.015em; }
.big q { quotes: "“" "”"; }
.big q::before, .big q::after { color: var(--accent); }
.labs { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; }

/* 문장 번호 버튼 */
.sref {
  display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; font-size: 12px; font-weight: 700; padding: 0 8px; margin-left: 4px; line-height: 20px; vertical-align: 1px;
}
.sref:hover { border-color: var(--accent); color: var(--accent); }
.cite {
  display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); background: var(--panel-2);
  border-radius: 0 12px 12px 0; padding: 10px 14px; font-weight: 600; line-height: 1.6;
}
.cite small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 2px; }

/* 판정이 갈린 문장 */
.mark { font-weight: 800; margin-right: 4px; }
.mark.good { color: var(--good); } .mark.warn { color: var(--warn); } .mark.mixed { color: var(--accent); } .mark.none { color: var(--ink-3); }

/* 점수 */
details.scores { margin-top: 10px; }
details.scores summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; margin-top: 6px; }
.segs { display: flex; gap: 3px; width: 90px; }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.segs i.on { background: var(--accent); }

.prio { font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 1px 8px; margin-right: 4px; }
.prio.높음 { background: var(--warn-soft); color: var(--warn); }
.prio.중간 { background: var(--accent-soft); color: var(--accent); }
.prio.낮음 { background: var(--panel-2); color: var(--ink-3); }
.by { display: inline-flex; gap: 3px; vertical-align: -6px; margin-left: 4px; }

/* 입력 중 표시 */
.typing { display: flex; gap: 10px; align-items: center; }
.dots { display: inline-flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 12px 14px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bop 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bop { 30% { transform: translateY(-4px); opacity: .5; } }

.dock { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; pointer-events: none; z-index: 15; }
.dock button {
  pointer-events: auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
  border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 700;
}
.dock button[hidden] { display: none; }

details.info { margin-top: 28px; font-size: 13.5px; color: var(--ink-2); }
details.info summary { cursor: pointer; font-weight: 700; }
details.info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0 0; }
details.info dt { color: var(--ink-3); }
details.info dd { margin: 0; }

/* 원문 시트 */
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 28, .35); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; width: min(760px, 100%); max-height: 80vh; z-index: 31;
  display: flex; flex-direction: column; visibility: hidden;
  transform: translate(-50%, 102%); transition: transform .25s ease-out, visibility 0s .25s;
  background: var(--panel); border-radius: 24px 24px 0 0; border: 1px solid var(--line); padding: 8px 20px 0;
}
.sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .25s ease-out; }
.orig { overflow: auto; flex: 1; min-height: 120px; padding-bottom: 24px; overscroll-behavior: contain; }
.handle { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 12px; border: 0; padding: 0; }
.sheet h3 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet .x { border: 0; background: var(--panel-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.orig p { margin: 0 0 12px; line-height: 1.85; }
.orig span { border-radius: 4px; padding: 1px 0; cursor: pointer; }
.orig span.hit { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); font-weight: 600; }
.orig .pr { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.focus { background: var(--panel-2); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-size: 14.5px; }
.focus ul { margin: 6px 0 0; padding-left: 18px; }
.focus li { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) {
  .msg, .note { animation: none; } .dots i { animation: none; } .sheet, .scrim { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-side"><a class="back" href="../../Plan_page.html" id="back">← 행로</a><span class="brand">CORTEX</span></div>
  <nav class="tabs" aria-label="화면"><a href="index.html">글 넣기</a><a href="view.html" aria-current="page">심의 보기</a></nav>
</header>

<main class="page">
  <div class="pick" id="pick"></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div id="after"></div>
</main>

<div class="dock"><button id="skip">바로 전부 보기</button></div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <button class="handle" id="handle" aria-label="닫기"></button>
  <h3><span id="sheetTitle">원문</span><button class="x" id="close">닫기</button></h3>
  <div id="focus"></div>
  <div class="orig" id="orig"></div>
</aside>

<script>
const D = __DATA__;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (D.local) $("#back").hidden = true;

const INITIAL = { recruiter: "채", technical: "기", reader: "독" };
const pname = (id) => (D.personas[id] || {}).name || id;
const av = (id, sm) => {
  const cls = id === "judge" ? "chair" : id === "analyst" ? "analyst" : "";
  const t = id === "judge" ? "의" : id === "analyst" ? "분" : INITIAL[id] || "?";
  return `<i class="av ${sm ? "sm " : ""}${cls}" title="${esc(id === "judge" ? "의장" : id === "analyst" ? "분석가" : pname(id))}">${t}</i>`;
};

// ---------- 결과 고르기 ----------
const params = new URLSearchParams(location.search);
const keys = Object.keys(D.runs);
const sampleKeys = keys.filter((k) => k.startsWith("sample_")).sort();
let key = params.get("run") || params.get("sample") || sampleKeys[0] || keys[0];
if (!D.runs[key]) key = sampleKeys[0] || keys[0];
const R = D.runs[key];

if (!R) {
  $("#chat").innerHTML = `<div class="note">아직 보여줄 결과가 없어요. <a href="index.html">글 넣기</a>에서 시작해 보세요.</div>`;
  $("#skip").hidden = true;
  throw new Error("no run");
}

(function picker() {
  const opts = sampleKeys.map((k) => `<option value="sample=${k}" ${k === key ? "selected" : ""}>${k.replace("sample_", "샘플 ")} · ${esc(D.notes[k] || "")}</option>`);
  if (!key.startsWith("sample_")) opts.unshift(`<option selected>내 글 · ${esc(R.run_id)}</option>`);
  $("#pick").innerHTML = `<label class="fine" for="sel">어떤 글의 심의를 볼까요?</label><select id="sel">${opts.join("")}</select>`;
  $("#sel").addEventListener("change", (e) => { if (e.target.value.includes("=")) location.search = "?" + e.target.value; });
})();

// ---------- 데이터 정리 ----------
const S = Object.fromEntries(R.sentences.map((s) => [s.id, s]));
const SIG = Object.fromEntries((R.signals.sentence_signals || []).map((x) => [x.sentence_id, x]));
const P = R.personas;

const sref = (ids) => (ids || []).filter((i) => S[i]).map((i) => `<button class="sref" data-sid="${i}">${i}</button>`).join("");
const cite = (id) => S[id] ? `<button class="cite" data-sid="${id}"><small>${id}</small>${esc(S[id].text)}</button>` : "";

// 문장마다 누가 강점/아쉬움으로 인용했는지 (코드가 근거 데이터에서 계산)
const byS = {};
P.forEach((p) => {
  (p.strengths || []).forEach((x) => (x.evidence_ids || []).forEach((i) => ((byS[i] ??= {})[p.persona_id] ??= { good: [], warn: [] }).good.push(x.claim)));
  (p.weaknesses || []).forEach((x) => (x.evidence_ids || []).forEach((i) => ((byS[i] ??= {})[p.persona_id] ??= { good: [], warn: [] }).warn.push(x.claim)));
});
const clashes = Object.entries(byS)
  .filter(([, v]) => Object.values(v).some((x) => x.good.length) && Object.values(v).some((x) => x.warn.length) && Object.keys(v).length > 1)
  .map(([sid]) => sid).sort();

function verdict(sid, pid) {
  const v = (byS[sid] || {})[pid];
  if (!v) return ["none", "–", "언급 없음", ""];
  if (v.good.length && v.warn.length) return ["mixed", "±", "강점이자 아쉬움", [...v.good, ...v.warn].join(" ")];
  if (v.good.length) return ["good", "✓", "강점", v.good.join(" ")];
  return ["warn", "△", "아쉬움", v.warn.join(" ")];
}

// ---------- 대화 대본 ----------
const script = [];
const say = (who, bubbles, extra = "") => script.push({ who, bubbles: [].concat(bubbles), extra });
const note = (html) => script.push({ note: html });

// 내 글
script.push({ me: true });

// 분석가: 첫인상
{
  const imp = R.impression || {};
  const counts = {};
  Object.values(SIG).forEach((x) => (counts[x.label] = (counts[x.label] || 0) + 1));
  const order = ["자신감", "열정", "망설임", "방어적", "중립"].filter((l) => counts[l]);
  const b1 = `<p class="big">이 글은 <q>${esc(imp.archetype || "")}</q>처럼 읽혀요.</p>`;
  const b2 = `<p>${esc(imp.summary || "")} ${sref(imp.evidence_sentence_ids)}</p>` +
    (order.length ? `<div class="labs" aria-label="문장별 어조">${order.map((l) => `<span class="lab ${l}">${l} ${counts[l]}문장</span>`).join("")}</div>` : "");
  const b3 = imp.key_contrast
    ? `<p><b>다만,</b> ${esc(imp.key_contrast)}</p>`
    : `<p>글 전체에서 어조가 뚜렷하게 바뀌는 곳은 발견되지 않았어요.</p>`;
  say("analyst", [b1, b2, b3]);
}

note("세 평가자는 서로의 평가를 보지 않고 각자 읽었어요");
say("judge", `<p>세 분 모두 읽어 오셨네요. 각자 기준으로 어떻게 보셨는지 한 분씩 들어볼게요.</p>`);

// 평가자 3명
P.forEach((p) => {
  const pid = p.persona_id;
  const scores = (p.scores || []).map((s) => `<div class="srow"><span>${esc(s.criterion)}</span><span class="segs" aria-label="${s.score}점 / 5점">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= s.score ? "on" : ""}"></i>`).join("")}</span></div>`).join("");
  const b1 = `<p>${esc(p.summary)}</p>` + (scores ? `<details class="scores"><summary>기준별 점수 보기</summary>${scores}</details>` : "");
  const sec = [];
  if ((p.strengths || []).length) sec.push(`<section><h4 class="good">좋았던 점</h4><ul>${p.strengths.map((x) => `<li>${esc(x.claim)}${sref(x.evidence_ids)}</li>`).join("")}</ul></section>`);
  if ((p.weaknesses || []).length) sec.push(`<section><h4 class="warn">아쉬운 점</h4><ul>${p.weaknesses.map((x) => `<li>${esc(x.claim)}${sref(x.evidence_ids)}</li>`).join("")}</ul></section>`);
  if ((p.recommendations || []).length) sec.push(`<section><h4>이렇게 고쳐보면</h4><ul>${p.recommendations.map((x) => `<li>${esc(x.suggestion)}${sref(x.target_ids)}<span class="why">${esc(x.reason)}</span></li>`).join("")}</ul></section>`);
  // 대화에서는 가장 먼저 짚은 아쉬움 하나만 말하고, 나머지는 눌러서 펼친다
  const w = (p.weaknesses || [])[0], s0 = (p.strengths || [])[0];
  const key = w ? `<p><span class="mark warn">△</span>제가 제일 아쉬웠던 건, ${esc(w.claim)}${sref(w.evidence_ids)}</p>`
               : s0 ? `<p><span class="mark good">✓</span>특히 좋았던 건, ${esc(s0.claim)}${sref(s0.evidence_ids)}</p>` : "";
  const n = (a) => (a || []).length;
  const more = sec.length ? `<details class="scores"><summary>좋았던 점 ${n(p.strengths)} · 아쉬운 점 ${n(p.weaknesses)} · 고쳐보면 ${n(p.recommendations)} 전부 듣기</summary><div style="margin-top:10px">${sec.join("")}</div></details>` : "";
  say(pid, [b1, key + more]);
});

// 판정이 갈린 문장
if (clashes.length) {
  const sid = clashes[0];
  say("judge", [`<p>잠깐, <b>같은 문장을 두고 판정이 갈렸어요.</b>${clashes.length > 1 ? ` (이런 문장이 ${clashes.length}개 있었어요${sref(clashes.slice(1))})` : ""}</p>`, cite(sid)]);
  P.forEach((p) => {
    const [cls, mark, word, claim] = verdict(sid, p.persona_id);
    if (cls === "none") return;
    say(p.persona_id, `<p><span class="mark ${cls}">${mark} ${word}</span>${esc(claim)}</p>`, "각자 평가에서 가져온 말");
  });
  const silent = P.filter((p) => verdict(sid, p.persona_id)[0] === "none").map((p) => pname(p.persona_id));
  if (silent.length) note(`${silent.join(", ")}는 이 문장을 언급하지 않았어요`);
} else if ((R.judge.disagreements || []).length) {
  const d = R.judge.disagreements[0];
  say("judge", `<p>세 분 의견이 <b>${esc(d.topic)}</b>에서 달랐어요.</p><ul>${(d.positions || []).map((x) => `<li><b>${esc(pname(x.persona_id))}</b> ${esc(x.position)}</li>`).join("")}</ul>`);
} else {
  say("judge", `<p>이번 글에서는 같은 문장을 두고 판정이 갈린 곳이 없었어요.</p>`);
}

// 의장 정리
{
  const J = R.judge || {};
  const keep = (J.keep || []).length ? `<section><h4 class="good">그대로 두세요</h4><ul>${J.keep.map((k) => `<li>${esc(k)}</li>`).join("")}</ul></section>` : "";
  const fix = (J.key_issues || []).length ? `<section><h4 class="warn">먼저 고칠 것</h4><ol style="margin:0;padding-left:20px">${J.key_issues.map((i) =>
    `<li><span class="prio ${esc(i.priority)}">${esc(i.priority)}</span>${esc(i.issue)}${sref(i.evidence_ids)}<span class="by" aria-label="제기한 평가자">${(i.raised_by || []).map((r) => av(r, true)).join("")}</span></li>`).join("")}</ol></section>` : "";
  say("judge", [`<p>정리할게요. ${esc(J.overall_summary || "")}</p>`, keep + fix]);
}
note("V1에서는 평가자들이 서로의 평가를 읽고 실제로 반박하는 토론 단계가 추가돼요");

// ---------- 그리기 ----------
const chat = $("#chat");
function render(item) {
  if (item.me) {
    const txt = R.sentences.reduce((acc, s, i, arr) => acc + (i && arr[i - 1].p !== s.p ? "\n\n" : i ? " " : "") + s.text, "");
    return `<div class="msg me"><div class="body"><div class="who">${key.startsWith("sample_") ? key.replace("sample_", "샘플 ") : "내 글"}</div>
      <div class="bubble"><div class="essay" id="essay">${esc(txt)}</div><button class="more" id="more">전체 보기</button></div></div></div>`;
  }
  if (item.note) return `<div class="note">${item.note}</div>`;
  const who = item.who === "judge" ? "의장" : item.who === "analyst" ? "분석가" : pname(item.who);
  const lens = item.extra || (D.personas[item.who] || {}).lens || (item.who === "analyst" ? "문장의 어조와 첫인상을 읽어요" : "");
  return `<div class="msg ${item.who === "judge" ? "chair" : ""}">${av(item.who)}<div class="body">
    <div class="who">${esc(who)}<span class="lens">${esc(lens)}</span></div>
    ${item.bubbles.map((b) => `<div class="bubble">${b}</div>`).join("")}</div></div>`;
}

let shown = 0, timer = null, typingEl = null;
function nearBottom() { return window.innerHeight + window.scrollY > document.body.scrollHeight - 220; }
function append(i) {
  const stick = nearBottom();
  chat.insertAdjacentHTML("beforeend", render(script[i]));
  if (script[i].me) wireEssay();
  if (stick && i > 0 && !REDUCED) window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}
function next() {
  typingEl?.remove(); typingEl = null;
  if (shown >= script.length) return finish();
  append(shown++);
  if (shown >= script.length) return finish();
  const n = script[shown];
  const wait = n.note ? 500 : Math.min(1500, 600 + (n.bubbles || []).join("").length * 0.9);
  if (!n.note && !n.me) {
    chat.insertAdjacentHTML("beforeend", `<div class="typing" id="typing">${av(n.who)}<span class="dots" aria-label="입력 중"><i></i><i></i><i></i></span></div>`);
    typingEl = $("#typing");
  }
  timer = setTimeout(next, wait);
}
function showAll() {
  clearTimeout(timer); typingEl?.remove(); typingEl = null;
  while (shown < script.length) chat.insertAdjacentHTML("beforeend", render(script[shown++]));
  wireEssay(); finish();
}
function finish() {
  $("#skip").hidden = true;
  if ($("#info")) return;
  $("#after").innerHTML = `<details class="info" id="info"><summary>실험 정보</summary><dl>
    <dt>모델</dt><dd>${esc(R.model)}</dd><dt>실행</dt><dd>${esc(R.run_id)} · ${esc(R.created_at)}</dd>
    <dt>근거 검증</dt><dd>원문에 없는 근거 ${R.invalid}건 제외</dd>
    <dt>방식</dt><dd>분석가 → 첫인상 → 평가자 3명 각자 평가 → 의장 종합 (AI 6번 호출). 대화 순서는 화면이 정리한 것이고, 판정이 갈린 문장은 코드가 평가자들의 근거 데이터에서 찾았어요.</dd>
    <dt>코드</dt><dd><a href="${D.repo}" target="_blank" rel="noopener">GitHub</a></dd></dl></details>
    <p class="fine">글이 이렇게 읽힌다는 인상이지, 작성자의 역량이나 성격을 판단한 것이 아니에요.</p>`;
}
function wireEssay() {
  const e = $("#essay"), m = $("#more");
  if (!e || m.dataset.w) return;
  m.dataset.w = 1;
  if (e.scrollHeight <= e.clientHeight + 2) { m.hidden = true; return; }
  m.addEventListener("click", () => { const o = e.classList.toggle("open"); m.textContent = o ? "접기" : "전체 보기"; });
}
$("#skip").addEventListener("click", showAll);
if (REDUCED) showAll(); else next();

// ---------- 원문 시트 ----------
const sheet = $("#sheet"), scrim = $("#scrim");
let lastFocus = null;
function openSheet(sid) {
  lastFocus = document.activeElement;
  const sig = SIG[sid];
  const who = Object.entries(byS[sid] || {}).map(([pid, v]) => {
    const [cls, mark, word] = verdict(sid, pid);
    return `<li>${av(pid, true)} <b>${esc(pname(pid))}</b> <span class="mark ${cls}">${mark} ${word}</span></li>`;
  });
  $("#sheetTitle").textContent = `${sid} 문장`;
  $("#focus").innerHTML = `<div class="focus">${sig ? `<span class="lab ${esc(sig.label)}">${esc(sig.label)}${"·".repeat(0)}</span> ${esc(sig.reason)}` : `<span class="fine">이 문장에는 인상 신호가 없어요.</span>`}
    ${who.length ? `<ul style="list-style:none;padding:0">${who.join("")}</ul>` : ""}</div>`;
  const paras = [];
  R.sentences.forEach((s) => { const last = paras[paras.length - 1]; if (!last || last.p !== s.p) paras.push({ p: s.p, ss: [s] }); else last.ss.push(s); });
  $("#orig").innerHTML = paras.map((g) => `<p><span class="pr">${esc(R.roles[g.p] || "")}</span>${g.ss.map((s) => `<span data-sid="${s.id}" class="${s.id === sid ? "hit" : ""}">${esc(s.text)}</span>`).join(" ")}</p>`).join("");
  sheet.classList.add("open"); scrim.classList.add("open");
  $("#close").focus();
  const orig = $("#orig"), hit = orig.querySelector(".hit");
  orig.scrollTop = hit ? Math.max(0, hit.offsetTop - orig.offsetTop - orig.clientHeight / 3) : 0;
}
function closeSheet() { sheet.classList.remove("open"); scrim.classList.remove("open"); sheet.style.transform = ""; lastFocus?.focus?.(); }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-sid]");
  if (t && (t.matches(".sref, .cite") || t.closest("#orig"))) openSheet(t.dataset.sid);
});
scrim.addEventListener("click", closeSheet);
$("#close").addEventListener("click", closeSheet);
$("#handle").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
// 아래로 밀어 닫기
let y0 = null;
sheet.addEventListener("touchstart", (e) => { if (!e.target.closest("#orig") || $("#orig").scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener("touchmove", (e) => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sheet.style.transform = `translate(-50%, ${dy}px)`; }, { passive: true });
sheet.addEventListener("touchend", (e) => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sheet.style.transform = ""; if (dy > 90) closeSheet(); });
</script>
</body>
</html>
